<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日午饭</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #fff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px 0;
      color: #111;
    }
    .meta {
      font-size: 14px;
      color: #666;
    }
    .recipe-card {
      margin-top: 20px;
    }
    .dish-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #000;
    }
    .tags {
      margin-bottom: 15px;
    }
    .tag {
      display: inline-block;
      background: #f0f0f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
      color: #555;
      margin-right: 8px;
    }
    .description {
      margin-bottom: 25px;
      color: #444;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-top: 25px;
      margin-bottom: 10px;
      border-left: 3px solid #ddd;
      padding-left: 10px;
    }
    ul {
      margin: 0;
      padding-left: 20px;
    }
    li {
      margin-bottom: 6px;
    }
    .reason-box {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 6px;
      margin-top: 30px;
      font-size: 14px;
      color: #555;
    }
    .actions {
      margin-top: 40px;
      display: flex;
      gap: 15px;
    }
    button {
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
    }
    button:hover {
      background: #f5f5f5;
    }
    button.primary {
      background: #333;
      color: #fff;
      border-color: #333;
    }
    button.primary:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>午饭推荐</h1>
      <div class="meta">May & E1 · 控糖 / 快手 / 中式为主</div>
    </header>

    <main id="app"></main>
  </div>

  <script>
    const menus = [
      {
        title: '清蒸鲈鱼 + 蒜蓉娃娃菜 + 杂粮饭',
        tags: ['35分钟', '低负担', '最稳'],
        desc: '非常适合工作日的一顿饭。鲈鱼只需蒸一下，娃娃菜清炒或淋汁，配上杂粮饭，吃完不会犯困。',
        ingredients: ['鲈鱼 1条', '娃娃菜 2颗', '姜、葱、蒸鱼豉油', '杂粮饭 (糙米/黑米)'],
        steps: ['鲈鱼处理干净，加姜丝蒸 10-12 分钟。', '娃娃菜焯水或蒜蓉快炒。', '出锅淋少许热油和豉油。'],
        reason: '控糖期最怕中午油大碳水多，这套方案清爽且蛋白质充足。'
      },
      {
        title: '虾仁炒蛋 + 清炒口蘑荷兰豆 + 玉米',
        tags: ['25分钟', '高蛋白', '快手'],
        desc: '既然你喜欢炒鸡蛋和蘑菇，这就是个舒适区的升级版。虾仁补充蛋白质，玉米替代部分精米。',
        ingredients: ['虾仁 250g', '鸡蛋 4个', '口蘑、荷兰豆', '甜玉米'],
        steps: ['虾仁简单滑油备用。', '鸡蛋炒至凝固，倒入虾仁拌匀。', '口蘑切片，和荷兰豆一起快炒。'],
        reason: '口味熟悉，做起来极快，且食材都是你喜欢的。'
      },
      {
        title: '番茄豆腐蛤蜊锅 + 凉拌黄瓜',
        tags: ['30分钟', '海鲜', '热汤'],
        desc: '带汤水的午饭吃起来舒服。番茄做底，蛤蜊和豆腐提供鲜味和饱腹感。',
        ingredients: ['蛤蜊 500g', '番茄 2个', '嫩豆腐 1盒', '黄瓜、木耳'],
        steps: ['番茄炒出沙，加水煮开。', '放入豆腐和蛤蜊，煮至开口。', '黄瓜拍碎，加木耳简单凉拌。'],
        reason: '比起干巴巴的饭菜，带汤的锅物更容易控制总量，吃完胃里舒服。'
      },
      {
        title: '黑椒三文鱼煎盘 + 芦笋南瓜',
        tags: ['35分钟', '轻西式', '满足感'],
        desc: '一点点西式调剂。三文鱼和南瓜是绝配，一锅煎出来也很省事。',
        ingredients: ['三文鱼 2块', '芦笋', '南瓜', '黑胡椒、柠檬'],
        steps: ['南瓜切块先蒸或微波弄熟。', '平底锅煎三文鱼和芦笋。', '撒黑胡椒和柠檬汁调味。'],
        reason: '偶尔换换口味，依然保持在控糖框架内，且不用洗太多锅。'
      },
      {
        title: '椒麻鸡腿肉 + 生菜 + 荞麦面',
        tags: ['30分钟', '微辣', '风味'],
        desc: '解馋用的。保留椒麻鸡的风味，但去掉重油，搭配清爽的荞麦面。',
        ingredients: ['去骨鸡腿 2个', '生菜', '金针菇', '荞麦面'],
        steps: ['鸡腿肉煎熟切块。', '调一个低油版的椒麻汁拌匀。', '生菜垫底，配少量荞麦面。'],
        reason: '想吃点有味道的时候选这个，心理满足感强，负担却不大。'
      },
      {
        title: '番茄牛腩 (快炖) + 油麦菜',
        tags: ['50分钟', '家常', '可留餐'],
        desc: '时间宽裕时的选择。做一次可以吃两顿，更有认真吃饭的感觉。',
        ingredients: ['牛腩 500g', '番茄 3个', '油麦菜', '少量米饭'],
        steps: ['牛腩焯水，番茄炒软。', '一起炖煮至软烂。', '油麦菜出锅前快炒。'],
        reason: '稳定的家常大菜，避免全是快手菜导致吃腻。'
      }
    ];

    let currentIndex = 0;
    const app = document.getElementById('app');

    function render() {
      const item = menus[currentIndex];
      app.innerHTML = `
        <div class="recipe-card">
          <div class="dish-title">${item.title}</div>
          <div class="tags">
            ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          <div class="description">${item.desc}</div>

          <div class="section-title">食材</div>
          <ul>
            ${item.ingredients.map(i => `<li>${i}</li>`).join('')}
          </ul>

          <div class="section-title">做法</div>
          <ul>
            ${item.steps.map(s => `<li>${s}</li>`).join('')}
          </ul>

          <div class="reason-box">
            <strong>推荐理由：</strong>${item.reason}
          </div>

          <div class="actions">
            <button onclick="nextDish()">换一个</button>
            <button class="primary" onclick="confirmDish()">就吃这个</button>
          </div>
        </div>
      `;
    }

    function nextDish() {
      currentIndex = (currentIndex + 1) % menus.length;
      render();
    }

    function confirmDish() {
      alert('好的，今天中午就定这个了。');
    }

    render();
  </script>
</body>
</html>
