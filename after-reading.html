<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After Reading — Mia</title>
    <link rel="stylesheet" href="styles-v2.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=JetBrains+Mono:wght@300;400&family=Noto+Serif+SC:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --serif: 'Fraunces', 'Noto Serif SC', serif;
            --mono: 'JetBrains Mono', monospace;
            --accent: #C9A87C;
            --bg: #0a0a09;
            --text: #E8E6E3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--serif);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        .en { display: inline !important; }
        .zh { display: none !important; }
        html[lang="zh"] .en { display: none !important; }
        html[lang="zh"] .zh { display: inline !important; }

        .hud {
            position: fixed;
            top: 24px;
            z-index: 100;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .hud:hover { opacity: 1; }
        .hud-left { left: 36px; }
        .hud-right { right: 36px; }
        .hud a, .hud button {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            background: none;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 12px;
            cursor: pointer;
        }
        .hud a { border: none; }

        .page-header {
            padding: 120px 40px 60px;
            max-width: 700px;
            margin: 0 auto;
        }
        .page-header h1 {
            font-size: 36px;
            font-weight: 300;
            font-style: italic;
            margin-bottom: 12px;
        }
        .page-header p {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.25);
        }

        .entries-list {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 40px 120px;
        }

        .entry {
            padding: 40px 0;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .entry-date {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.2em;
            color: rgba(201,168,124,0.4);
            margin-bottom: 16px;
        }
        .entry-source {
            font-family: var(--mono);
            font-size: 9px;
            color: rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }
        .entry-source a {
            color: rgba(201,168,124,0.35);
            text-decoration: none;
            border-bottom: 1px solid rgba(201,168,124,0.1);
        }
        .entry-title {
            font-size: 22px;
            font-weight: 300;
            font-style: italic;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .entry-body {
            font-size: 14px;
            font-weight: 300;
            line-height: 2.2;
            color: rgba(255,255,255,0.6);
        }
        .entry-body p {
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .page-header { padding: 100px 24px 40px; }
            .entries-list { padding: 0 24px 80px; }
            .entry-title { font-size: 18px; }
            .hud-left { left: 20px; }
            .hud-right { right: 20px; }
        }
        /* Light theme */
    langBtn.onclick = () => {
        const z = html.lang === 'zh';
        html.lang = z ? 'en' : 'zh';
        langBtn.textContent = z ? '中文' : 'EN';
        localStorage.setItem('mia-lang', z ? 'en' : 'zh');
    };
    </script>
</body>
</html>
