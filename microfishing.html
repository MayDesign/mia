<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MicroFishing - 小物钓</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(30, 30, 45, 0.6);
            --accent-pink: #ff6b9d;
            --accent-purple: #c084fc;
            --accent-blue: #60a5fa;
            --accent-cyan: #22d3ee;
            --accent-orange: #fb923c;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        html[data-theme="light"] {
            --bg: #F5F0E8;
            --surface: #EDE8E0;
            --text: #2A2520;
            --text-dim: #B0A89E;
            --accent: #8B6914;
            --accent-dim: rgba(139, 105, 20, 0.1);
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* Background gradient orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            pointer-events: none;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: var(--accent-purple);
            top: -100px;
            right: -100px;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: var(--accent-pink);
            bottom: 200px;
            left: -80px;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: var(--accent-blue);
            bottom: -50px;
            right: 50px;
        }

        /* Header */
        .header {
            padding: 60px 24px 24px;
            position: relative;
            z-index: 10;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .greeting {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .profile-btn:hover {
            transform: scale(1.05);
        }

        /* Stats cards */
        .stats-container {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            flex: 1;
            padding: 16px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
        }

        .stat-card:nth-child(2)::before {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
        }

        .stat-card:nth-child(3)::before {
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-pink));
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main content */
        .main-content {
            padding: 0 24px 100px;
            position: relative;
            z-index: 10;
        }

        /* Section title */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
        }

        .section-action {
            font-size: 14px;
            color: var(--accent-cyan);
            cursor: pointer;
        }

        /* Aquarium card */
        .aquarium-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            height: 280px;
        }

        .aquarium-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .aquarium-title {
            font-size: 18px;
            font-weight: 600;
        }

        .aquarium-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Fish in aquarium */
        .fish-tank {
            position: relative;
            height: 180px;
            background: linear-gradient(180deg, rgba(96, 165, 250, 0.1) 0%, rgba(34, 211, 238, 0.05) 100%);
            border-radius: 20px;
            overflow: hidden;
        }

        .tank-fish {
            position: absolute;
            font-size: 36px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
            cursor: pointer;
            transition: transform 0.3s;
        }

        .tank-fish:hover {
            transform: scale(1.2);
        }

        .tank-fish-1 {
            top: 30px;
            left: 20px;
            animation: swim1 20s infinite linear;
        }

        .tank-fish-2 {
            top: 80px;
            right: 30px;
            animation: swim2 25s infinite linear;
        }

        .tank-fish-3 {
            top: 120px;
            left: 50%;
            animation: swim3 22s infinite linear;
        }

        @keyframes swim1 {
            0%, 100% { transform: translateX(0) scaleX(1); }
            50% { transform: translateX(200px) scaleX(1); }
            51% { transform: translateX(200px) scaleX(-1); }
            99% { transform: translateX(0) scaleX(-1); }
        }

        @keyframes swim2 {
            0%, 100% { transform: translateX(0) scaleX(-1); }
            50% { transform: translateX(-150px) scaleX(-1); }
            51% { transform: translateX(-150px) scaleX(1); }
            99% { transform: translateX(0) scaleX(1); }
        }

        @keyframes swim3 {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(50px) translateY(-20px); }
            50% { transform: translateX(0) translateY(0); }
            75% { transform: translateX(-50px) translateY(20px); }
        }

        /* Quick actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-card {
            padding: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .action-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
        }

        .action-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .action-icon.pink {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(255, 107, 157, 0.1));
        }

        .action-icon.blue {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), rgba(96, 165, 250, 0.1));
        }

        .action-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .action-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Recent catches */
        .catches-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .catch-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .catch-item:hover {
            transform: translateX(4px);
        }

        .catch-emoji {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.15), rgba(192, 132, 252, 0.15));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .catch-info {
            flex: 1;
        }

        .catch-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .catch-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .catch-weight {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        /* Tab bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            padding: 16px 24px 32px;
            background: linear-gradient(180deg, transparent 0%, var(--bg-primary) 20%);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .tab-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-item.active {
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-item.active .tab-icon {
            color: var(--accent-cyan);
        }

        .tab-icon {
            font-size: 24px;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .tab-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Add button */
        .add-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-pink) 0%, var(--accent-purple) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 8px 32px rgba(255, 107, 157, 0.4);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(255, 107, 157, 0.5);
        }

        /* Back link */
        .back-link {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            padding: 10px 16px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            transition: transform 0.2s;
        }

        .back-link:hover {
            transform: scale(1.05);
        }

        /* Desktop */
        @media (min-width: 768px) {
            body {
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 20px;
            }

            .app-container {
                height: 90vh;
                border-radius: 40px;
                box-shadow: 0 25px 80px rgba(0,0,0,0.8);
            }
        }
    </style>
<script>(function(){var t=localStorage.getItem('mia-theme');if(t)document.documentElement.setAttribute('data-theme',t)})()</script>

<body>
    <button class="theme-btn" id="themeToggle" style="position:fixed;top:24px;right:80px;font-family:monospace;font-size:11px;color:var(--text-dim,#999);background:none;border:1px solid rgba(128,128,128,0.15);padding:4px 10px;cursor:pointer;z-index:100;">☀</button>
    <a href="index.html" class="back-link">← Hub</a>

    <!-- Background orbs -->
    <div class="bg-orb orb-1"></div>

    <div class="bg-orb orb-3"></div>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <div>
                    <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 4px;">早上好 👋</div>

            <!-- Stats -->
            <div class="stats-container">

                    <div class="stat-value" style="color: var(--accent-pink);">12</div>

                </div>

                    <div class="stat-label">钓鱼次数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--accent-orange);">5</div>
                    <div class="stat-label">钓点</div>

            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Aquarium -->
            <div class="section-header">

            </div>

            <div class="aquarium-card">

                    <div class="aquarium-status">
                        <div class="status-dot"></div>
                        <span>活跃</span>

                <div class="fish-tank">

                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <a href="microfishing-gear.html" class="action-card" style="text-decoration: none; color: inherit;">
                    <div class="action-icon pink">🎒</div>

                </a>
                <a href="microfishing-map.html" class="action-card" style="text-decoration: none; color: inherit;">

            </div>

            <!-- Recent Catches -->

                <div class="section-title">最近收获</div>

            </div>

            <div class="catches-list">
                <div class="catch-item">
                    <div class="catch-emoji">🐟</div>

                    <div class="catch-weight">156g</div>
                </div>
                <div class="catch-item">
                    <div class="catch-emoji">🐠</div>
                    <div class="catch-info">
                        <div class="catch-name">鳑鲏</div>
                        <div class="catch-meta">朝阳公园 · 昨天</div>
                    </div>
                    <div class="catch-weight">23g</div>
                </div>
                <div class="catch-item">
                    <div class="catch-emoji">🦈</div>
                    <div class="catch-info">
                        <div class="catch-name">白条</div>
                        <div class="catch-meta">奥林匹克公园 · 3天前</div>
                    </div>
                    <div class="catch-weight">45g</div>
                </div>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <div class="tab-item active">
                <span class="tab-icon">🏠</span>
                <span class="tab-label">首页</span>
            </div>
            <a href="microfishing-encyclopedia.html" class="tab-item" style="text-decoration: none; color: inherit;">
                <span class="tab-icon">📖</span>
                <span class="tab-label">图鉴</span>
            </a>
            <div class="add-btn" onclick="addCatch()">+</div>
            <a href="microfishing-gear.html" class="tab-item" style="text-decoration: none; color: inherit;">
                <span class="tab-icon">🎒</span>
                <span class="tab-label">装备</span>

                <span class="tab-label">我的</span>

        </div>
    </div>

    <script>
        // Add catch
        function addCatch() {
            alert('🎣 记录新的钓鱼收获！\n\n功能：\n• 拍照识别鱼种\n• 记录重量/尺寸\n• 标记钓点位置\n• 添加心情笔记');
        }

        // Show gear page
        function showGear() {
            alert('🎒 装备管理\n\n• 钓竿：3根\n• 鱼线：5卷\n• 鱼钩：各种型号\n• 饵料库存\n• 装备组合方案');
        }

        // Show map
        function showMap() {
            alert('🗺️ 钓点地图\n\n• 标记去过的位置\n• 查看每个钓点的收获\n• 环境数据（水温、天气）\n• 私密钓点评级');
        }

        // Show encyclopedia
        function showEncyclopedia() {
            alert('📖 鱼种图鉴\n\n• 已解锁：12种\n• 待发现：23种\n• 详细生态信息\n• 最佳钓鱼时间');
        }

        // Show profile
        function showProfile() {
            alert('👤 个人中心\n\n• 统计数据\n• 成就徽章\n• 钓鱼日历\n• 设置');
        }

        // Interactive fish
        document.querySelectorAll('.tank-fish').forEach(fish => {
            fish.addEventListener('click', function() {
                this.style.transform = 'scale(1.3)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 300);
            });
        });
    
        // Theme toggle
        var themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            var savedTheme = localStorage.getItem('mia-theme');
            if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = (document.documentElement.getAttribute('data-theme') === 'light') ? '☾' : '☀';
            themeToggle.addEventListener('click', function() {
                var isLight = document.documentElement.getAttribute('data-theme') === 'light';
                var newTheme = isLight ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('mia-theme', newTheme);
                themeToggle.textContent = isLight ? '☀' : '☾';
            });
        }
    </script>
