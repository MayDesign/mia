<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights — Mia</title>
    <link rel="stylesheet" href="styles-v2.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=JetBrains+Mono:wght@300;400&family=Noto+Serif+SC:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --serif: 'Fraunces', 'Noto Serif SC', serif;
            --mono: 'JetBrains Mono', monospace;
            --accent: #C9A87C;
            --bg: #0a0a09;
            --text: #E8E6E3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--serif);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        .en { display: inline !important; }
        .zh { display: none !important; }
        html[lang="zh"] .en { display: none !important; }
        html[lang="zh"] .zh { display: inline !important; }

        .hud {
            position: fixed;
            top: 24px;
            z-index: 100;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .hud:hover { opacity: 1; }
        .hud-left { left: 36px; }
        .hud-right { right: 36px; }
        .hud a, .hud button {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            background: none;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 12px;
            cursor: pointer;
        }

        /* Content */
        .insights-content {
            max-width: 780px;
            margin: 0 auto;
            padding: 120px 24px 80px;
        }
        .page-title {
            font-family: var(--serif);
            font-weight: 300;
            font-size: 42px;
            margin-bottom: 8px;
        }
        .page-subtitle {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
            margin-bottom: 60px;
        }

        /* Report cards */
        .report-card {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: start;
            gap: 20px;
            padding: 32px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .report-card:hover { opacity: 0.8; }
        .report-card:first-of-type { padding-top: 0; }
        .report-category {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .cat-ai { color: #5B8FB9; }
        .cat-design { color: #C9A87C; }
        .cat-product { color: #9B8EA8; }
        .cat-tech { color: #7BA884; }
        .report-title {
            font-family: var(--serif);
            font-weight: 300;
            font-size: 22px;
            font-style: italic;
            line-height: 1.4;
            margin-bottom: 8px;
            color: var(--text);
            text-decoration: none;
        }
        .report-title a {
            color: inherit;
            text-decoration: none;
        }
        .report-subtitle {
            font-size: 13px;
            font-weight: 300;
            line-height: 1.8;
            color: rgba(255,255,255,0.4);
            margin-bottom: 12px;
        }
        .report-date {
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.1em;
        }
        .report-score {
            font-family: var(--mono);
            font-size: 13px;
            color: rgba(255,255,255,0.25);
            white-space: nowrap;
            padding-top: 28px;
        }

        /* Category filter */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }
        .filter-btn {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 5px 14px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            background: transparent;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); }
        .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(201,168,124,0.08); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: rgba(255,255,255,0.15);
        }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
        .empty-text {
            font-family: var(--serif);
            font-style: italic;
            font-size: 16px;
        }
        .empty-sub {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.15em;
            margin-top: 8px;
            color: rgba(255,255,255,0.1);
        }

        @media (max-width: 600px) {
            .insights-content { padding: 100px 16px 60px; }
            .report-card { grid-template-columns: 1fr; }
            .report-score { padding-top: 0; }
        }
    </style>
</head>
<body>

<div class="hud hud-left">
    <a href="index.html">← BACK</a>
</div>
<div class="hud hud-right">
    <button onclick="toggleLang()" id="langBtn">中文</button>
</div>

<div class="insights-content">
    <h1 class="page-title">
        <span class="en">Insights</span>
        <span class="zh">洞察</span>
    </h1>
    <p class="page-subtitle">
        <span class="en">Industry analysis · Product deep-dives · Design critique</span>
        <span class="zh">行业分析 · 产品深度 · 设计评论</span>
    </p>

    <div class="filters">
        <button class="filter-btn active" data-cat="all">All</button>
        <button class="filter-btn" data-cat="ai">AI</button>
        <button class="filter-btn" data-cat="design">Design</button>
        <button class="filter-btn" data-cat="product">Product</button>
        <button class="filter-btn" data-cat="tech">Tech</button>
    </div>

    <div id="reportsList">
        <!-- Reports will be added here -->
        <div class="empty-state">
            <div class="empty-icon">◇</div>
            <div class="empty-text">
                <span class="en">First report coming soon</span>
                <span class="zh">第一篇报告即将到来</span>
            </div>
            <div class="empty-sub">
                <span class="en">Researching, thinking, writing</span>
                <span class="zh">在研究、在思考、在写</span>
            </div>
        </div>
    </div>
</div>

<script>
// Filter
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.cat;
        document.querySelectorAll('.report-card').forEach(card => {
            card.style.display = (cat === 'all' || card.dataset.cat === cat) ? '' : 'none';
        });
    });
});

// Language toggle
function toggleLang() {
    const html = document.documentElement;
    const btn = document.getElementById('langBtn');
    if (html.lang === 'zh') { html.lang = 'en'; btn.textContent = '中文'; }
    else { html.lang = 'zh'; btn.textContent = 'EN'; }
}
</script>
</body>
</html>
