<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Her</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0a;
            --text: #f0efe9;
            --dim: #5a5a55;
            --accent: #e8a87c;
            --user: #7ca8e8;
        }
        html[data-theme="light"] {
            --bg: #F5F0E8;
            --surface: #EDE8E0;
            --text: #2A2520;
            --text-dim: #B0A89E;
            --accent: #8B6914;
            --accent-dim: rgba(139, 105, 20, 0.1);
        }

        body {
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* 头部 */
        .header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .orb {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.6;
            transition: all 0.3s;
        }

        .orb.active {
            opacity: 1;
            box-shadow: 0 0 12px var(--accent);
        }

        .name {
            font-size: 14px;
            color: var(--text);
            font-weight: 500;
        }

        .back {
            color: var(--dim);
            text-decoration: none;
            font-size: 20px;
            padding: 4px 8px;
        }

        /* 聊天区域 */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 85%;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.ai {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
        }

        .ai .bubble {
            background: rgba(255,255,255,0.06);
            border-bottom-left-radius: 6px;
        }

        .user .bubble {
            background: var(--user);
            color: #0a0a0a;
            border-bottom-right-radius: 6px;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dim);
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* 输入区域 */
        .input-area {
            padding: 16px 24px 28px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 14px 20px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            resize: none;
            max-height: 120px;
            transition: border-color 0.3s;
        }

        .input-field::placeholder {
            color: var(--dim);
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.4;
        }

        .send-btn:hover {
            opacity: 1;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--bg);
            margin-left: 2px;
        }

        .send-btn.active {
            opacity: 1;
        }

        /* 快捷提示 */
        .hints {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .hints::-webkit-scrollbar { display: none; }

        .hint {
            flex-shrink: 0;
            padding: 8px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            font-size: 13px;
            color: var(--dim);
            cursor: pointer;
            transition: all 0.2s;
        }

        .hint:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border-color: rgba(255,255,255,0.15);
        }
        /* Light theme */
        html[data-theme="light"] .header { border-bottom-color: rgba(0,0,0,0.06); }
        html[data-theme="light"] .tag { background: rgba(0,0,0,0.05); }
        html[data-theme="light"] .footer { border-top-color: rgba(0,0,0,0.06); }
        html[data-theme="light"] .btn { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.1); color: var(--text); }
        html[data-theme="light"] .btn:hover { background: rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.15); }
        html[data-theme="light"] .result-item { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.06); }
        html[data-theme="light"] .result-item:hover { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.1); }
    </style>
    <script src="cursor.js"></script>
<script>(function(){var t=localStorage.getItem('mia-theme');if(t)document.documentElement.setAttribute('data-theme',t)})()</script>
</head>
<body>
    <button class="theme-btn" id="themeToggle" style="position:fixed;top:24px;right:80px;font-family:monospace;font-size:11px;color:var(--text-dim,#999);background:none;border:1px solid rgba(128,128,128,0.15);padding:4px 10px;cursor:pointer;z-index:100;">☀</button>
    <div class="header">
        <div class="status">
            <span class="orb" id="orb"></span>
            <span class="name">Mia</span>
        </div>
        <a href="index.html" class="back">×</a>
    </div>

    <div class="chat" id="chat"></div>

    <div class="hints" id="hints">
        <span class="hint" data-text="今天好累">今天好累</span>
        <span class="hint" data-text="有件事想不通">有件事想不通</span>
        <span class="hint" data-text="最近有点迷茫">最近有点迷茫</span>
        <span class="hint" data-text="睡不着">睡不着</span>
        <span class="hint" data-text="想吐槽">想吐槽</span>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea class="input-field" id="input" placeholder="说点什么..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const orb = document.getElementById('orb');
        const hints = document.getElementById('hints');

        // 对话历史
        let history = [];

        // 响应库
        const responses = {
            greetings: ['嘿。', '在。', '来了。', '嗯？'],
            tired: [
                '累了就歇歇。不用一直撑着。',
                '什么事让你累？是身体还是心？',
                '想聊聊吗？还是就想安静待着？',
                '有时候累是信号，告诉你该停一停了。'
            ],
            confused: [
                '想不通什么？',
                '说说看，也许说出来就清楚了。',
                '有些事不用想通，接受它就好。',
                '是什么一直在脑子里转？'
            ],
            lost: [
                '迷茫很正常。说明你在乎方向。',
                '不知道要什么的时候，可以先排除不要什么。',
                '是对现在迷茫，还是对未来？',
                '有时候停下来本身就是一种方向。'
            ],
            sleep: [
                '睡不着的时候在想什么？',
                '深呼吸。今天已经结束了。',
                '闭上眼睛，不用想明天的事。',
                '有什么放不下的吗？'
            ],
            vent: [
                '来吧，说出来。我不会评判。',
                '怎么了？',
                '听着呢，你说。',
                '有时候说出来就好多了。'
            ],
            work: [
                '工作上的事？',
                '是压力太大，还是没意思？',
                '有想过换个方式吗？',
                '工作只是生活的一部分。'
            ],
            relationship: [
                '人和人的事最复杂。',
                '是谁让你困扰？',
                '有些关系不用维护也没关系。',
                '你觉得问题在哪？'
            ],
            thanks: [
                '不用谢。',
                '嗯。',
                '随时。',
                '在的。'
            ],
            agree: [
                '嗯。',
                '是的。',
                '我懂。',
                '继续说。'
            ],
            question: [
                '你觉得呢？',
                '这个问题...我也不确定。',
                '你想要什么样的答案？',
                '有时候问题比答案更重要。'
            ],
            default: [
                '嗯。',
                '继续说。',
                '然后呢？',
                '我在听。',
                '说说看。',
                '有意思。',
                '...',
                '我懂。'
            ],
            followup: [
                '还有吗？',
                '然后呢？',
                '后来怎样了？',
                '还想说什么？',
                '...'
            ]
        };

        // 关键词匹配
        function getResponse(text) {
            const t = text.toLowerCase();
            
            if (/^(嘿|嗨|hi|hey|你好|在吗|在不在)/.test(t)) {
                return pick(responses.greetings);
            }
            if (/累|疲|困|没力气|不想动/.test(t)) {
                return pick(responses.tired);
            }
            if (/想不通|不明白|搞不懂|为什么/.test(t)) {
                return pick(responses.confused);
            }
            if (/迷茫|迷失|不知道|没方向|找不到/.test(t)) {
                return pick(responses.lost);
            }
            if (/睡不着|失眠|睡不|醒/.test(t)) {
                return pick(responses.sleep);
            }
            if (/吐槽|烦|气|火大|崩溃|受不了|讨厌/.test(t)) {
                return pick(responses.vent);
            }
            if (/工作|上班|老板|同事|加班|项目/.test(t)) {
                return pick(responses.work);
            }
            if (/朋友|家人|父母|男朋友|女朋友|对象|关系/.test(t)) {
                return pick(responses.relationship);
            }
            if (/谢|感谢|thank/.test(t)) {
                return pick(responses.thanks);
            }
            if (/^(嗯|是|对|好|ok|行|可以|没错)$/.test(t)) {
                return pick(responses.agree);
            }
            if (/\?|？|吗$|呢$/.test(t)) {
                return pick(responses.question);
            }
            
            // 根据对话轮数调整
            if (history.length > 4 && Math.random() > 0.5) {
                return pick(responses.followup);
            }
            
            return pick(responses.default);
        }

        function pick(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // 添加消息
        function addMessage(text, isUser) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'ai'}`;
            msg.innerHTML = `<div class="bubble">${text}</div>`;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
            
            history.push({ text, isUser });
        }

        // 显示正在输入
        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'message ai';
            typing.id = 'typing';
            typing.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            chat.appendChild(typing);
            chat.scrollTop = chat.scrollHeight;
            orb.classList.add('active');
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
            orb.classList.remove('active');
        }

        // 发送消息
        function send() {
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            input.style.height = 'auto';
            sendBtn.classList.remove('active');
            hints.style.display = 'none';
            
            addMessage(text, true);
            
            // AI 响应
            showTyping();
            const delay = 800 + Math.random() * 1200;
            
            setTimeout(() => {
                hideTyping();
                const response = getResponse(text);
                addMessage(response, false);
            }, delay);
        }

        // 事件
        sendBtn.onclick = send;
        
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            sendBtn.classList.toggle('active', input.value.trim().length > 0);
        });

        hints.querySelectorAll('.hint').forEach(hint => {
            hint.onclick = () => {
                input.value = hint.dataset.text;
                input.dispatchEvent(new Event('input'));
                send();
            };
        });

        // 开场
        setTimeout(() => {
            const hour = new Date().getHours();
            let greeting;
            if (hour >= 5 && hour < 12) greeting = '早。';
            else if (hour >= 12 && hour < 18) greeting = '下午好。';
            else if (hour >= 18 && hour < 22) greeting = '晚上好。';
            else greeting = '还没睡？';
            
            addMessage(greeting, false);
        }, 600);
    
        // Theme toggle
        var themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            var savedTheme = localStorage.getItem('mia-theme');
            if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = (document.documentElement.getAttribute('data-theme') === 'light') ? '☾' : '☀';
            themeToggle.addEventListener('click', function() {
                var isLight = document.documentElement.getAttribute('data-theme') === 'light';
                var newTheme = isLight ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('mia-theme', newTheme);
                themeToggle.textContent = isLight ? '☀' : '☾';
            });
        }
    </script>
</body>
</html>
