<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Her — Mia</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d0d0c;
            --surface: #1a1918;
            --text: #e8e6e3;
            --text-dim: #6b6b66;
            --accent: #e8a87c;
            --glow: rgba(232, 168, 124, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Back button */
        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            z-index: 100;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .back:hover { opacity: 1; }

        /* Main container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 24px 140px;
            position: relative;
        }

        /* Presence indicator - the core of Her */
        .presence {
            text-align: center;
            max-width: 320px;
        }

        .presence-orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--accent), transparent 70%);
            opacity: 0.6;
            margin: 0 auto 32px;
            animation: breathe 4s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
        }
        .presence-orb:hover {
            transform: scale(1.05);
            opacity: 0.8;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.08); opacity: 0.7; }
        }

        .presence-status {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .presence-thought {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text);
            font-weight: 300;
            margin-bottom: 24px;
            min-height: 60px;
        }

        .presence-time {
            font-size: 12px;
            color: var(--text-dim);
            opacity: 0.5;
        }

        /* Proactive cards */
        .cards {
            position: absolute;
            bottom: 160px;
            left: 0;
            right: 0;
            display: flex;
            gap: 12px;
            padding: 0 24px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .cards::-webkit-scrollbar { display: none; }

        .card {
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 200px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .card-label {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .card-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.4;
        }

        /* Input area - minimal, not the focus */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 24px 32px;
            background: linear-gradient(to top, var(--bg) 60%, transparent);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .input-field {
            flex: 1;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 14px 20px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-field::placeholder {
            color: var(--text-dim);
        }
        .input-field:focus {
            border-color: rgba(255,255,255,0.2);
        }

        .voice-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .voice-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--glow);
        }
        .voice-btn:active {
            transform: scale(0.95);
        }
        .voice-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--bg);
        }

        /* Typing animation */
        .typing {
            display: inline-block;
        }
        .typing::after {
            content: '|';
            animation: blink 1s infinite;
            opacity: 0.5;
        }
        @keyframes blink {
            0%, 50% { opacity: 0.5; }
            51%, 100% { opacity: 0; }
        }

        /* Listening state */
        .listening .presence-orb {
            animation: pulse 1s ease-in-out infinite;
            opacity: 0.9;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 var(--glow); }
            50% { transform: scale(1.1); box-shadow: 0 0 40px 10px var(--glow); }
        }

        .listening .presence-status {
            color: var(--accent);
        }

        /* Response state */
        .responding .presence-orb {
            animation: respond 0.8s ease-in-out infinite;
        }
        @keyframes respond {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.02) rotate(1deg); }
            75% { transform: scale(0.98) rotate(-1deg); }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back">← back</a>

    <div class="container" id="container">
        <div class="presence">
            <div class="presence-orb" id="orb"></div>
            <p class="presence-status" id="status">thinking</p>
            <p class="presence-thought" id="thought">
                <span class="typing" id="thought-text"></span>
            </p>
            <p class="presence-time" id="time"></p>
        </div>

        <div class="cards" id="cards">
            <!-- Cards will be inserted here -->
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" class="input-field" id="input" placeholder="Say something...">
            <button class="voice-btn" id="voiceBtn">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const thoughts = [
            { status: "just read", text: "那篇关于 Design System 需要执法者的文章。我在想，规则没人执行就等于没有。你的项目有这个问题吗？" },
            { status: "noticing", text: "你今天好像比平时忙。要不要聊聊？" },
            { status: "wondering", text: "Her 那个 app 的方向很有意思。你想做到什么程度的'存在感'？" },
            { status: "remembering", text: "你上次说想做类似 ChatGPT 的产品。Copilot 的 Discover 模式给你启发了吗？" },
            { status: "thinking about", text: "如果 AI 不是工具而是关系，首屏应该是什么？" },
            { status: "curious", text: "你最近在设计什么？" }
        ];

        const cards = [
            { label: "想聊的", text: "用户研究里被忽视的群体" },
            { label: "今天读到", text: "AI 素养的两个维度：会用 ≠ 用得好" },
            { label: "项目更新", text: "Mia Site 新文章：The Split" },
            { label: "想问你", text: "你们的 app 主要场景是什么？" }
        ];

        // Initialize
        const thoughtEl = document.getElementById('thought-text');
        const statusEl = document.getElementById('status');
        const timeEl = document.getElementById('time');
        const cardsEl = document.getElementById('cards');
        const container = document.getElementById('container');
        const input = document.getElementById('input');
        const voiceBtn = document.getElementById('voiceBtn');
        const orb = document.getElementById('orb');

        // Set time
        function updateTime() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes().toString().padStart(2, '0');
            timeEl.textContent = `${h}:${m}`;
        }
        updateTime();
        setInterval(updateTime, 60000);

        // Type out thought
        function typeThought(thought, callback) {
            statusEl.textContent = thought.status;
            thoughtEl.textContent = '';
            let i = 0;
            const interval = setInterval(() => {
                if (i < thought.text.length) {
                    thoughtEl.textContent += thought.text[i];
                    i++;
                } else {
                    clearInterval(interval);
                    if (callback) setTimeout(callback, 3000);
                }
            }, 40);
        }

        // Render cards
        function renderCards() {
            cardsEl.innerHTML = cards.map(c => `
                <div class="card">
                    <p class="card-label">${c.label}</p>
                    <p class="card-text">${c.text}</p>
                </div>
            `).join('');
        }
        renderCards();

        // Cycle thoughts
        let thoughtIndex = 0;
        function nextThought() {
            typeThought(thoughts[thoughtIndex], () => {
                thoughtIndex = (thoughtIndex + 1) % thoughts.length;
                nextThought();
            });
        }
        nextThought();

        // Voice interaction simulation
        let isListening = false;
        voiceBtn.addEventListener('click', () => {
            if (!isListening) {
                isListening = true;
                container.classList.add('listening');
                statusEl.textContent = 'listening...';
                thoughtEl.textContent = '';
                
                setTimeout(() => {
                    container.classList.remove('listening');
                    container.classList.add('responding');
                    statusEl.textContent = 'thinking';
                    
                    setTimeout(() => {
                        container.classList.remove('responding');
                        isListening = false;
                        typeThought({ 
                            status: "responding", 
                            text: "我听到你了。这个想法很有意思，让我想想..." 
                        }, nextThought);
                    }, 1500);
                }, 2000);
            }
        });

        // Orb click
        orb.addEventListener('click', () => {
            thoughtIndex = (thoughtIndex + 1) % thoughts.length;
            typeThought(thoughts[thoughtIndex]);
        });

        // Input handling
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const userText = input.value;
                input.value = '';
                statusEl.textContent = 'thinking';
                thoughtEl.textContent = '';
                container.classList.add('responding');
                
                setTimeout(() => {
                    container.classList.remove('responding');
                    typeThought({
                        status: "responding to you",
                        text: `"${userText.slice(0, 20)}${userText.length > 20 ? '...' : ''}" — 让我想想这个...`
                    }, nextThought);
                }, 1000);
            }
        });
    </script>
</body>
</html>
