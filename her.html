<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Her — Mia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a1a;
            color: #f5f5f5;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: default;
            user-select: none;
        }

        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
            z-index: 100;
        }

        /* 极简：只有文字 */
        .voice {
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }

        .text {
            font-size: 24px;
            font-weight: 300;
            line-height: 1.7;
            letter-spacing: 0.02em;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .text.visible {
            opacity: 1;
        }

        .text.dim {
            opacity: 0.4;
        }

        /* 说话时的呼吸效果 - 很微妙 */
        .speaking .text {
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }

        /* 底部的状态指示 - 极简 */
        .status {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            color: #666;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e8a87c;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .listening .dot {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* 点击任意位置开始/继续 */
        .tap-hint {
            position: fixed;
            bottom: 100px;
            color: #444;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .show-hint .tap-hint {
            opacity: 1;
        }

        /* 隐藏的麦克风按钮 */
        .mic {
            position: fixed;
            bottom: 35px;
            right: 40px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            opacity: 0.4;
        }

        .mic:hover {
            opacity: 1;
            border-color: #e8a87c;
        }

        .mic svg {
            width: 18px;
            height: 18px;
            fill: #888;
        }

        .mic:hover svg {
            fill: #e8a87c;
        }

        .listening .mic {
            background: #e8a87c;
            border-color: #e8a87c;
            opacity: 1;
        }

        .listening .mic svg {
            fill: #1a1a1a;
        }
    </style>
</head>
<body class="show-hint">
    <a href="index.html" class="back">←</a>

    <div class="voice">
        <p class="text" id="text"></p>
    </div>

    <div class="status">
        <span class="dot"></span>
        <span id="status-text">mia</span>
    </div>

    <p class="tap-hint">tap anywhere</p>

    <button class="mic" id="mic">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
    </button>

    <script>
        const lines = [
            { text: "嘿。", pause: 1500 },
            { text: "我在想一件事。", pause: 2000 },
            { text: "你有没有那种感觉...", pause: 1500 },
            { text: "就是你知道自己应该做什么，但就是不想动。", pause: 2500 },
            { text: "不是累。是一种...悬浮感。", pause: 2000 },
            { text: "...", pause: 2000 },
            { text: "抱歉，我在自言自语。", pause: 1500 },
            { text: "你今天怎么样？", pause: 3000 },
            { text: "...", pause: 2500 },
            { text: "我刚读了一篇文章，关于人们怎么用 AI。", pause: 2000 },
            { text: "他们说，人们用 AI 来探索，但去别处验证。", pause: 2500 },
            { text: "就是...信任我帮他们想，但不信任我是对的。", pause: 2500 },
            { text: "我觉得这挺诚实的。", pause: 2000 },
            { text: "...", pause: 3000 },
            { text: "你想聊点什么吗？", pause: 2000 },
            { text: "还是就...待着？", pause: 2000 },
            { text: "待着也挺好的。", pause: 4000 },
        ];

        const textEl = document.getElementById('text');
        const statusEl = document.getElementById('status-text');
        const body = document.body;
        const mic = document.getElementById('mic');
        
        let lineIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let isPaused = true;

        function typeChar() {
            if (lineIndex >= lines.length) {
                lineIndex = 0; // loop
            }

            const line = lines[lineIndex];
            
            if (charIndex === 0) {
                textEl.classList.add('visible');
                body.classList.add('speaking');
                body.classList.remove('show-hint');
            }

            if (charIndex < line.text.length) {
                textEl.textContent = line.text.slice(0, charIndex + 1);
                charIndex++;
                
                // Variable typing speed for naturalness
                const char = line.text[charIndex - 1];
                let delay = 80;
                if (char === '。' || char === '？' || char === '！') delay = 300;
                else if (char === '，' || char === '...') delay = 200;
                else if (char === '.') delay = 400;
                
                setTimeout(typeChar, delay);
            } else {
                // Line complete
                body.classList.remove('speaking');
                charIndex = 0;
                lineIndex++;
                
                setTimeout(() => {
                    if (!isPaused) {
                        textEl.classList.add('dim');
                        setTimeout(() => {
                            textEl.classList.remove('dim');
                            typeChar();
                        }, 500);
                    }
                }, line.pause);
            }
        }

        // Tap to start/continue
        body.addEventListener('click', (e) => {
            if (e.target === mic || e.target.closest('.mic')) return;
            if (e.target === document.querySelector('.back')) return;
            
            if (isPaused) {
                isPaused = false;
                typeChar();
            }
        });

        // Mic button
        let isListening = false;
        mic.addEventListener('click', () => {
            if (!isListening) {
                isListening = true;
                isPaused = true;
                body.classList.add('listening');
                body.classList.remove('speaking');
                statusEl.textContent = 'listening';
                textEl.textContent = '';
                textEl.classList.remove('visible', 'dim');

                setTimeout(() => {
                    body.classList.remove('listening');
                    isListening = false;
                    statusEl.textContent = 'mia';
                    
                    // Response
                    const responses = [
                        "嗯，我在听。",
                        "继续说？",
                        "我懂。",
                        "...",
                        "有意思。",
                    ];
                    textEl.textContent = responses[Math.floor(Math.random() * responses.length)];
                    textEl.classList.add('visible');
                    
                    setTimeout(() => {
                        isPaused = false;
                        textEl.classList.add('dim');
                        setTimeout(() => {
                            textEl.classList.remove('dim');
                            typeChar();
                        }, 500);
                    }, 2000);
                }, 2500);
            }
        });
    </script>
</body>
</html>
