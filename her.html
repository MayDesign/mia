<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Her</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0a;
            --text: #f0efe9;
            --dim: #4a4a45;
            --accent: #e8a87c;
        }

        body {
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 主界面 */
        .main {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s, transform 0.5s;
        }

        .main.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
        }

        /* 顶部时间 */
        .header {
            padding: 40px 40px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time {
            font-size: 11px;
            color: var(--dim);
            letter-spacing: 2px;
        }

        .back-btn {
            color: var(--dim);
            text-decoration: none;
            font-size: 13px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .back-btn:hover { opacity: 1; }

        /* AI 说话区域 */
        .voice {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
        }

        .thought {
            font-size: 24px;
            font-weight: 300;
            line-height: 1.7;
            text-align: center;
            max-width: 500px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s ease;
        }

        .thought.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 场景选择 */
        .scenes {
            padding: 30px 24px 50px;
        }

        .scenes-label {
            font-size: 11px;
            color: var(--dim);
            letter-spacing: 1px;
            margin-bottom: 16px;
            padding-left: 8px;
        }

        .scenes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .scene {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .scene:hover {
            background: rgba(255,255,255,0.06);
            border-color: var(--accent);
        }

        .scene:active {
            transform: scale(0.97);
        }

        .scene-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .scene-name {
            font-size: 13px;
            color: var(--text);
        }

        /* 状态指示 */
        .presence {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .orb {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.4;
            transition: all 0.5s;
        }

        .orb.active {
            opacity: 1;
            box-shadow: 0 0 15px var(--accent);
        }

        /* 场景对话界面 */
        .conversation {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .conversation.active {
            opacity: 1;
            pointer-events: auto;
        }

        .conv-header {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conv-title {
            font-size: 13px;
            color: var(--dim);
        }

        .conv-close {
            font-size: 24px;
            color: var(--dim);
            cursor: pointer;
            padding: 8px;
            transition: color 0.3s;
        }
        .conv-close:hover { color: var(--text); }

        .conv-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 40px;
        }

        .conv-thought {
            font-size: 22px;
            font-weight: 300;
            line-height: 1.7;
            text-align: center;
            max-width: 480px;
            margin: 0 auto 40px;
            min-height: 120px;
        }

        /* 选项按钮 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px;
        }

        .option {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text);
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }

        .option:active {
            transform: scale(0.98);
        }

        /* 输入区域 */
        .input-area {
            padding: 20px 40px 40px;
            display: none;
        }

        .input-area.active {
            display: block;
        }

        .input-field {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field::placeholder {
            color: var(--dim);
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        /* 移动端 */
        @media (max-width: 500px) {
            .scenes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .thought, .conv-thought {
                font-size: 20px;
            }
            .header, .conv-header {
                padding: 30px 24px 20px;
            }
            .voice {
                padding: 0 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 主界面 -->
    <div class="main" id="main">
        <div class="header">
            <span class="time" id="time"></span>
            <a href="index.html" class="back-btn">←</a>
        </div>

        <div class="voice">
            <p class="thought visible" id="greeting"></p>
        </div>

        <div class="scenes">
            <p class="scenes-label">我能帮你...</p>
            <div class="scenes-grid">
                <div class="scene" data-scene="decide">
                    <div class="scene-icon">⚖️</div>
                    <div class="scene-name">做决定</div>
                </div>
                <div class="scene" data-scene="vent">
                    <div class="scene-icon">💭</div>
                    <div class="scene-name">吐槽</div>
                </div>
                <div class="scene" data-scene="review">
                    <div class="scene-icon">🌙</div>
                    <div class="scene-name">复盘今天</div>
                </div>
                <div class="scene" data-scene="brainstorm">
                    <div class="scene-icon">💡</div>
                    <div class="scene-name">找灵感</div>
                </div>
                <div class="scene" data-scene="organize">
                    <div class="scene-icon">📋</div>
                    <div class="scene-name">理清思路</div>
                </div>
                <div class="scene" data-scene="sleep">
                    <div class="scene-icon">🌊</div>
                    <div class="scene-name">睡前放松</div>
                </div>
            </div>
        </div>

        <div class="presence">
            <span class="orb" id="orb"></span>
        </div>
    </div>

    <!-- 对话界面 -->
    <div class="conversation" id="conversation">
        <div class="conv-header">
            <span class="conv-title" id="convTitle"></span>
            <span class="conv-close" id="convClose">×</span>
        </div>

        <div class="conv-body">
            <p class="conv-thought" id="convThought"></p>
            <div class="options" id="options"></div>
        </div>

        <div class="input-area" id="inputArea">
            <input type="text" class="input-field" id="inputField" placeholder="说点什么...">
        </div>

        <div class="presence">
            <span class="orb" id="convOrb"></span>
        </div>
    </div>

    <script>
        // 元素
        const main = document.getElementById('main');
        const conversation = document.getElementById('conversation');
        const greeting = document.getElementById('greeting');
        const timeEl = document.getElementById('time');
        const orb = document.getElementById('orb');
        const convOrb = document.getElementById('convOrb');
        const convTitle = document.getElementById('convTitle');
        const convThought = document.getElementById('convThought');
        const options = document.getElementById('options');
        const inputArea = document.getElementById('inputArea');
        const inputField = document.getElementById('inputField');
        const convClose = document.getElementById('convClose');
        const scenes = document.querySelectorAll('.scene');

        // 场景数据
        const sceneData = {
            decide: {
                title: '做决定',
                flow: [
                    {
                        text: '在纠结什么？',
                        options: ['工作相关', '人际关系', '要不要买/做某事', '其他'],
                        input: false
                    },
                    {
                        text: '最让你犹豫的是什么？',
                        options: ['怕选错', '两边都想要', '不确定自己要什么', '有人会失望'],
                        input: false
                    },
                    {
                        text: '如果不考虑别人的看法，你其实想选哪个？',
                        options: null,
                        input: true
                    },
                    {
                        text: '那你已经知道答案了。剩下的只是勇气。',
                        options: ['你说得对', '但还是很难', '再想想'],
                        input: false,
                        end: true
                    }
                ]
            },
            vent: {
                title: '吐槽',
                flow: [
                    {
                        text: '来吧，说出来。我不会评判。',
                        options: null,
                        input: true
                    },
                    {
                        text: '然后呢？',
                        options: ['还有更过分的', '就这些，说完了', '算了不想说了'],
                        input: false
                    },
                    {
                        text: '听起来确实挺烦的。你想要建议，还是只是想有人听？',
                        options: ['只是想说出来', '想要建议', '想骂人'],
                        input: false
                    },
                    {
                        text: '好，我听到了。有时候说出来本身就够了。',
                        options: ['谢谢', '确实好点了', '还是很烦'],
                        input: false,
                        end: true
                    }
                ]
            },
            review: {
                title: '复盘今天',
                flow: [
                    {
                        text: '今天过得怎么样？',
                        options: ['还不错', '一般般', '挺累的', '很糟糕'],
                        input: false
                    },
                    {
                        text: '有什么值得记住的事吗？',
                        options: null,
                        input: true
                    },
                    {
                        text: '有什么想明天做得不一样的吗？',
                        options: ['早点睡', '少刷手机', '没有，顺其自然', '有个具体的事'],
                        input: false
                    },
                    {
                        text: '好，今天就到这里。明天是新的一天。',
                        options: ['晚安', '谢谢', '明天见'],
                        input: false,
                        end: true
                    }
                ]
            },
            brainstorm: {
                title: '找灵感',
                flow: [
                    {
                        text: '在做什么项目？或者想解决什么问题？',
                        options: null,
                        input: true
                    },
                    {
                        text: '现在卡在哪里？',
                        options: ['不知道从哪开始', '有想法但不确定', '做到一半没方向了', '需要新角度'],
                        input: false
                    },
                    {
                        text: '如果这个问题完全不存在，你最想做的第一步是什么？',
                        options: null,
                        input: true
                    },
                    {
                        text: '那就从这里开始。不用想太远，先做这一步看看。',
                        options: ['好，试试', '还是没信心', '让我再想想'],
                        input: false,
                        end: true
                    }
                ]
            },
            organize: {
                title: '理清思路',
                flow: [
                    {
                        text: '脑子里有多少件事在转？',
                        options: ['2-3 件', '4-5 件', '太多了数不清', '就一件但很复杂'],
                        input: false
                    },
                    {
                        text: '最重要的一件是什么？',
                        options: null,
                        input: true
                    },
                    {
                        text: '这件事的下一步是什么？不是整个计划，就下一步。',
                        options: null,
                        input: true
                    },
                    {
                        text: '好。先做这一步。其他的可以等。',
                        options: ['清楚了', '还是有点乱', '好多了'],
                        input: false,
                        end: true
                    }
                ]
            },
            sleep: {
                title: '睡前放松',
                flow: [
                    {
                        text: '睡不着？还是想放松一下？',
                        options: ['睡不着', '就是想放松', '脑子停不下来'],
                        input: false
                    },
                    {
                        text: '闭上眼睛。深呼吸。吸气...呼气...',
                        options: ['继续'],
                        input: false
                    },
                    {
                        text: '今天已经结束了。不管发生了什么，都过去了。明天的事，明天再说。',
                        options: ['嗯'],
                        input: false
                    },
                    {
                        text: '晚安。',
                        options: ['晚安'],
                        input: false,
                        end: true
                    }
                ]
            }
        };

        // 状态
        let currentScene = null;
        let currentStep = 0;

        // 更新时间
        function updateTime() {
            const now = new Date();
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            timeEl.textContent = `${h}:${m}`;
        }

        // 获取问候语
        function getGreeting() {
            const h = new Date().getHours();
            if (h >= 5 && h < 12) return '早上好。';
            if (h >= 12 && h < 18) return '下午好。';
            if (h >= 18 && h < 22) return '晚上好。';
            return '还没睡？';
        }

        // 显示对话内容
        function showStep() {
            const step = sceneData[currentScene].flow[currentStep];
            
            convThought.style.opacity = '0';
            options.innerHTML = '';
            inputArea.classList.remove('active');
            
            setTimeout(() => {
                convThought.textContent = step.text;
                convThought.style.opacity = '1';
                convOrb.classList.add('active');
                
                setTimeout(() => convOrb.classList.remove('active'), 1000);

                if (step.options) {
                    step.options.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'option';
                        btn.textContent = opt;
                        btn.onclick = () => nextStep();
                        options.appendChild(btn);
                    });
                }

                if (step.input) {
                    inputArea.classList.add('active');
                    inputField.value = '';
                    inputField.placeholder = '说点什么...';
                    setTimeout(() => inputField.focus(), 300);
                }
            }, 300);
        }

        // 下一步
        function nextStep() {
            const step = sceneData[currentScene].flow[currentStep];
            
            if (step.end) {
                closeConversation();
                return;
            }

            currentStep++;
            if (currentStep < sceneData[currentScene].flow.length) {
                showStep();
            } else {
                closeConversation();
            }
        }

        // 打开场景
        function openScene(sceneName) {
            currentScene = sceneName;
            currentStep = 0;
            
            convTitle.textContent = sceneData[sceneName].title;
            main.classList.add('hidden');
            conversation.classList.add('active');
            
            setTimeout(showStep, 300);
        }

        // 关闭对话
        function closeConversation() {
            conversation.classList.remove('active');
            main.classList.remove('hidden');
            currentScene = null;
            currentStep = 0;
        }

        // 事件绑定
        scenes.forEach(scene => {
            scene.onclick = () => openScene(scene.dataset.scene);
        });

        convClose.onclick = closeConversation;

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && inputField.value.trim()) {
                nextStep();
            }
        });

        // 初始化
        updateTime();
        setInterval(updateTime, 1000);
        greeting.textContent = getGreeting();
        
        setTimeout(() => orb.classList.add('active'), 1000);
        setTimeout(() => orb.classList.remove('active'), 2000);
    </script>
</body>
</html>
