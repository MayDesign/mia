<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Her — Mia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a1a;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }

        .content {
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 24px;
            color: #e8a87c;
        }

        .desc {
            font-size: 18px;
            line-height: 1.7;
            color: #aaa;
            margin-bottom: 40px;
        }

        .box {
            background: #222;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            text-align: left;
            margin-bottom: 24px;
        }

        .box h2 {
            font-size: 14px;
            color: #888;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .box p {
            font-size: 14px;
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .box code {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #e8a87c;
        }

        .note {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back">←</a>

    <div class="content">
        <h1>Her</h1>
        <p class="desc">
            一个类似电影《Her》的语音对话体验。<br>
            和 Mia 真正对话，不是预设脚本。
        </p>

        <div class="box">
            <h2>这是本地功能</h2>
            <p>
                Her 需要连接本地运行的 OpenClaw Gateway，<br>
                所以只能在你自己的电脑上使用。
            </p>
            <p>
                如果你有 OpenClaw，运行：
            </p>
            <p>
                <code>open ~/.openclaw/workspace/local/her.html</code>
            </p>
        </div>

        <p class="note">
            为什么？因为真正的对话需要真正的 AI，<br>
            而不是云端的某个通用接口。
        </p>
    </div>
</body>
</html>
