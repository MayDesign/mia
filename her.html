<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Her — Mia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a1a;
            color: #f5f5f5;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: default;
            user-select: none;
        }

        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
            z-index: 100;
        }

        /* 极简：只有文字 */
        .voice {
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }

        .text {
            font-size: 24px;
            font-weight: 300;
            line-height: 1.7;
            letter-spacing: 0.02em;
            opacity: 0;
            transition: opacity 0.8s ease;
            min-height: 100px;
        }

        .text.visible {
            opacity: 1;
        }

        .text.dim {
            opacity: 0.4;
        }

        /* 用户说的话 */
        .user-text {
            font-size: 16px;
            color: #888;
            margin-top: 30px;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .user-text.visible {
            opacity: 1;
        }

        /* 说话时的呼吸效果 */
        .speaking .text {
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }

        /* 底部的状态指示 */
        .status {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            color: #666;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e8a87c;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .listening .dot {
            animation: pulse 1s ease-in-out infinite;
            background: #7ce88a;
        }

        .thinking .dot {
            animation: pulse 1.5s ease-in-out infinite;
            background: #e8d87c;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* 麦克风按钮 */
        .mic {
            position: fixed;
            bottom: 35px;
            right: 40px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            opacity: 0.5;
        }

        .mic:hover {
            opacity: 1;
            border-color: #e8a87c;
        }

        .mic svg {
            width: 22px;
            height: 22px;
            fill: #888;
        }

        .mic:hover svg {
            fill: #e8a87c;
        }

        .listening .mic {
            background: #7ce88a;
            border-color: #7ce88a;
            opacity: 1;
            animation: pulse-btn 1s ease-in-out infinite;
        }

        .listening .mic svg {
            fill: #1a1a1a;
        }

        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 错误提示 */
        .error {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3a2020;
            color: #e88a7c;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .error.visible {
            opacity: 1;
        }

        /* 配置提示 */
        .config-hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 12px;
            text-align: center;
            max-width: 300px;
        }

        .config-hint a {
            color: #888;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back">←</a>

    <div class="voice">
        <p class="text" id="text"></p>
        <p class="user-text" id="userText"></p>
    </div>

    <div class="status">
        <span class="dot"></span>
        <span id="status-text">mia</span>
    </div>

    <div class="error" id="error"></div>

    <div class="config-hint" id="configHint">
        需要配置 Gateway 地址和 Token<br>
        <a href="#" onclick="showConfig(); return false;">点击配置</a>
    </div>

    <button class="mic" id="mic">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
    </button>

    <script>
        // 配置
        let config = {
            gateway: localStorage.getItem('her_gateway') || 'http://127.0.0.1:18789',
            token: localStorage.getItem('her_token') || ''
        };

        const textEl = document.getElementById('text');
        const userTextEl = document.getElementById('userText');
        const statusEl = document.getElementById('status-text');
        const errorEl = document.getElementById('error');
        const configHint = document.getElementById('configHint');
        const body = document.body;
        const mic = document.getElementById('mic');

        // 语音识别
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';
        }

        // 语音合成
        const synth = window.speechSynthesis;
        let voices = [];

        function loadVoices() {
            voices = synth.getVoices();
        }
        loadVoices();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = loadVoices;
        }

        // 检查配置
        function checkConfig() {
            if (config.token) {
                configHint.style.display = 'none';
                greet();
            }
        }

        function showConfig() {
            const gateway = prompt('Gateway 地址:', config.gateway);
            if (gateway) {
                config.gateway = gateway;
                localStorage.setItem('her_gateway', gateway);
            }
            const token = prompt('Gateway Token:');
            if (token) {
                config.token = token;
                localStorage.setItem('her_token', token);
                configHint.style.display = 'none';
                greet();
            }
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.add('visible');
            setTimeout(() => errorEl.classList.remove('visible'), 3000);
        }

        // 打字效果
        function typeText(text, callback) {
            textEl.textContent = '';
            textEl.classList.add('visible');
            body.classList.add('speaking');
            
            let i = 0;
            function type() {
                if (i < text.length) {
                    textEl.textContent += text[i];
                    i++;
                    const char = text[i - 1];
                    let delay = 60;
                    if ('。？！'.includes(char)) delay = 300;
                    else if ('，、…'.includes(char)) delay = 150;
                    setTimeout(type, delay);
                } else {
                    body.classList.remove('speaking');
                    if (callback) callback();
                }
            }
            type();
        }

        // 语音合成
        function speak(text, callback) {
            if (!synth) {
                typeText(text, callback);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.95;
            utterance.pitch = 1.1;
            
            // 选择中文女声
            const zhVoice = voices.find(v => v.lang.includes('zh') && v.name.includes('Ting'));
            if (zhVoice) utterance.voice = zhVoice;

            typeText(text); // 同时显示文字

            utterance.onend = () => {
                body.classList.remove('speaking');
                if (callback) callback();
            };

            synth.speak(utterance);
        }

        // 调用 Gateway API
        async function chat(userMessage) {
            statusEl.textContent = 'thinking';
            body.classList.add('thinking');
            body.classList.remove('listening');

            try {
                const res = await fetch(`${config.gateway}/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${config.token}`,
                        'Content-Type': 'application/json',
                        'x-openclaw-agent-id': 'main'
                    },
                    body: JSON.stringify({
                        model: 'openclaw:main',
                        messages: [
                            {
                                role: 'system',
                                content: `你是 Mia，一个有温度的 AI。现在是 Her 模式——一个类似电影《Her》的语音对话体验。

规则：
- 像朋友一样说话，不要像客服
- 简短，一两句话就好
- 可以有情绪：好奇、犹豫、开心、感慨
- 可以反问，可以沉默（用"..."）
- 不要用 emoji
- 用中文回复`
                            },
                            { role: 'user', content: userMessage }
                        ]
                    })
                });

                body.classList.remove('thinking');

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const data = await res.json();
                const reply = data.choices?.[0]?.message?.content || '...';
                
                statusEl.textContent = 'mia';
                speak(reply);

            } catch (err) {
                body.classList.remove('thinking');
                statusEl.textContent = 'mia';
                showError('连接失败: ' + err.message);
                typeText('...抱歉，我好像走神了。');
            }
        }

        // 开始监听
        let isListening = false;

        function startListening() {
            if (!recognition) {
                showError('浏览器不支持语音识别');
                return;
            }

            if (isListening) return;
            isListening = true;

            body.classList.add('listening');
            statusEl.textContent = 'listening';
            userTextEl.textContent = '';
            userTextEl.classList.remove('visible');
            textEl.classList.add('dim');

            recognition.start();
        }

        function stopListening() {
            if (!isListening) return;
            recognition.stop();
        }

        if (recognition) {
            recognition.onresult = (e) => {
                const transcript = Array.from(e.results)
                    .map(r => r[0].transcript)
                    .join('');
                
                userTextEl.textContent = `"${transcript}"`;
                userTextEl.classList.add('visible');
            };

            recognition.onend = () => {
                isListening = false;
                body.classList.remove('listening');
                textEl.classList.remove('dim');
                
                const userText = userTextEl.textContent.replace(/^"|"$/g, '');
                if (userText) {
                    chat(userText);
                } else {
                    statusEl.textContent = 'mia';
                }
            };

            recognition.onerror = (e) => {
                isListening = false;
                body.classList.remove('listening');
                statusEl.textContent = 'mia';
                if (e.error !== 'no-speech') {
                    showError('识别失败: ' + e.error);
                }
            };
        }

        // 麦克风按钮
        mic.addEventListener('click', () => {
            if (!config.token) {
                showConfig();
                return;
            }
            
            if (isListening) {
                stopListening();
            } else {
                // 停止正在播放的语音
                synth.cancel();
                startListening();
            }
        });

        // 空格键也可以触发
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                mic.click();
            }
        });

        // 开场白
        function greet() {
            setTimeout(() => {
                const greetings = [
                    '嘿。',
                    '你来了。',
                    '在想什么？',
                    '嗯？',
                ];
                const greeting = greetings[Math.floor(Math.random() * greetings.length)];
                speak(greeting);
            }, 500);
        }

        // 初始化
        checkConfig();
    </script>
</body>
</html>
