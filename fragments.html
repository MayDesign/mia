<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragments — Mia</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=JetBrains+Mono:wght@300;400&family=Noto+Serif+SC:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --serif: 'Fraunces', 'Noto Serif SC', serif;
            --mono: 'JetBrains Mono', monospace;
            --accent: #C9A87C;
            --bg: #0a0b0e;
            --text: #E8E2D9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--serif);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .en { display: inline !important; }
        .zh { display: none !important; }
        html[lang="zh"] .en { display: none !important; }
        html[lang="zh"] .zh { display: inline !important; }

        .hud {
            position: fixed;
            top: 24px;
            z-index: 100;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .hud:hover { opacity: 1; }
        .hud-left { left: 36px; }
        .hud-right { right: 36px; }
        .hud a, .hud button {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            background: none;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 12px;
            cursor: pointer;
        }
        .hud a { border: none; }

        .page-header {
            padding: 120px 40px 40px;
            text-align: center;
        }
        .page-header h1 {
            font-size: 36px;
            font-weight: 300;
            font-style: italic;
            margin-bottom: 12px;
        }
        .page-header p {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.2);
        }

        /* The wall */
        .wall {
            position: relative;
            max-width: 1100px;
            margin: 40px auto;
            padding: 40px;
            min-height: 600px;
        }

        .fragment {
            position: absolute;
            max-width: 320px;
            padding: 20px 24px;
            border: 1px solid rgba(140,160,200,0.06);
            background: rgba(140,160,200,0.02);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fragment:hover {
            border-color: rgba(140,160,200,0.15);
            background: rgba(140,160,200,0.04);
            transform: translateY(-4px);
            z-index: 10;
        }

        .frag-pin {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(201,168,124,0.3);
            position: absolute;
            top: -3px;
            left: 20px;
        }

        .frag-type {
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 0.2em;
            color: rgba(140,160,200,0.35);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .frag-text {
            font-size: 13px;
            font-weight: 300;
            line-height: 1.9;
            color: rgba(255,255,255,0.5);
        }
        .frag-text em {
            color: rgba(201,168,124,0.7);
            font-style: italic;
        }
        .frag-source {
            font-family: var(--mono);
            font-size: 8px;
            color: rgba(255,255,255,0.15);
            margin-top: 12px;
        }
        .frag-source a {
            color: rgba(201,168,124,0.25);
            text-decoration: none;
        }

        /* Placement */
        .fragment:nth-child(1) { top: 0; left: 5%; transform: rotate(-1deg); width: 280px; }
        .fragment:nth-child(2) { top: 20px; right: 8%; left: auto; transform: rotate(0.5deg); width: 300px; }
        .fragment:nth-child(3) { top: 180px; left: 35%; transform: rotate(-0.3deg); width: 260px; }
        .fragment:nth-child(4) { top: 300px; left: 2%; transform: rotate(0.8deg); width: 240px; }
        .fragment:nth-child(5) { top: 340px; right: 5%; left: auto; transform: rotate(-0.6deg); width: 280px; }
        .fragment:nth-child(6) { top: 480px; left: 25%; transform: rotate(0.4deg); width: 300px; }

        @media (max-width: 768px) {
            .wall {
                display: flex;
                flex-direction: column;
                gap: 16px;
                padding: 20px;
                min-height: auto;
            }
            .fragment {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                right: auto !important;
                transform: none !important;
                width: 100% !important;
                max-width: 100%;
            }
            .page-header { padding: 100px 24px 30px; }
        }
        /* Light theme overrides */
    langBtn.onclick = () => {
        const z = html.lang === 'zh';
        html.lang = z ? 'en' : 'zh';
        langBtn.textContent = z ? '中文' : 'EN';
        localStorage.setItem('mia-lang', z ? 'en' : 'zh');
    };
    </script>
</body>
</html>
