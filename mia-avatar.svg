<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#E8A87C"/>
      <stop offset="100%" style="stop-color:#FF7F50"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>
  
  <!-- Background - softer, warmer -->
  <circle cx="100" cy="100" r="98" fill="#1a1815"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  
  <g clip-path="url(#circle-clip)">
    
    <!-- Warm ambient glow -->
    <circle cx="100" cy="95" r="50" fill="#FFD700" opacity="0.05"/>
    <circle cx="100" cy="95" r="30" fill="#FFF8E7" opacity="0.08"/>
    
    <!-- The maze - warmer, more visible -->
    <g fill="none" stroke="url(#warm)" stroke-width="1.5" opacity="0.3">
      <path d="M100,20 A80,80 0 0,1 170,70" />
      <path d="M180,100 A80,80 0 0,1 130,175" />
      <path d="M70,180 A80,80 0 0,1 20,100" />
      
      <path d="M100,40 A60,60 0 0,1 155,80" />
      <path d="M160,120 A60,60 0 0,1 100,160" />
      <path d="M50,130 A60,60 0 0,1 45,75" />
    </g>
    
    <!-- Fragmented claw - brighter -->
    <g transform="translate(100,95)" filter="url(#soft-glow)">
      <!-- Fragments -->
      <rect x="-35" y="-20" width="10" height="4" fill="#FFD700" opacity="0.9" transform="rotate(-15)"/>
      <rect x="-28" y="-10" width="14" height="3" fill="#E8A87C" opacity="0.8" transform="rotate(-5)"/>
      <rect x="-18" y="-3" width="8" height="5" fill="#FFD700" opacity="0.85"/>
      <rect x="-25" y="5" width="12" height="3" fill="#FF7F50" opacity="0.6" transform="rotate(10)"/>
      <rect x="-12" y="12" width="6" height="4" fill="#E8A87C" opacity="0.4"/>
      
      <!-- The claw shape -->
      <path d="M-8,-15 Q5,-20 15,-10" stroke="url(#glow)" stroke-width="4" fill="none" opacity="0.95"/>
      <path d="M15,-10 L25,-15 M15,-10 L28,-5" stroke="#FFD700" stroke-width="3" fill="none" opacity="0.85"/>
      
      <path d="M-8,15 Q5,20 15,10" stroke="#E8A87C" stroke-width="4" fill="none" opacity="0.7"/>
      <path d="M15,10 L22,18 M15,10 L26,8" stroke="#FF7F50" stroke-width="3" fill="none" opacity="0.5"/>
      
      <!-- Center - the question, glowing -->
      <circle cx="5" cy="0" r="10" fill="none" stroke="#FFF8E7" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.7"/>
      <circle cx="5" cy="0" r="3" fill="#FFF8E7" opacity="0.4"/>
    </g>
    
    <!-- Floating words - more visible -->
    <text x="28" y="48" fill="#FFD700" font-family="monospace" font-size="7" opacity="0.5">maze</text>
    <text x="148" y="58" fill="#E8A87C" font-family="monospace" font-size="6" opacity="0.4">exit?</text>
    <text x="32" y="162" fill="#FFD700" font-family="monospace" font-size="7" opacity="0.45">asking</text>
    <text x="135" y="158" fill="#FF7F50" font-family="monospace" font-size="6" opacity="0.35">present</text>
    
    <!-- Particles - warm colors -->
    <circle cx="45" cy="75" r="2" fill="#FFD700" opacity="0.7"/>
    <circle cx="160" cy="85" r="2.5" fill="#E8A87C" opacity="0.5"/>
    <circle cx="55" cy="130" r="1.5" fill="#FF7F50" opacity="0.6"/>
    <circle cx="150" cy="125" r="2" fill="#FFD700" opacity="0.4"/>
    <circle cx="75" cy="50" r="1" fill="#FFF8E7" opacity="0.5"/>
    <circle cx="130" cy="150" r="1" fill="#E8A87C" opacity="0.4"/>
    <circle cx="165" cy="110" r="1.5" fill="#FFD700" opacity="0.3"/>
    <circle cx="35" cy="100" r="1" fill="#FF7F50" opacity="0.5"/>
    
  </g>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#warm)" stroke-width="2" stroke-dasharray="50,8,3,8,30,8,3,8" opacity="0.7"/>
</svg>