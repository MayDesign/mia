<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfish</title>
    <style>*{margin:0;padding:0;}html,body{height:100%;overflow:hidden;background:#000;}canvas{display:block;width:100%;height:100%;}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false });

function resize() {
    const dpr = Math.min(window.devicePixelRatio, 1.5);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

let mx = 0.5, my = 0.5;
document.addEventListener('mousemove', e => {
    mx = e.clientX / window.innerWidth;
    my = 1.0 - e.clientY / window.innerHeight;
});
document.addEventListener('touchmove', e => {
    mx = e.touches[0].clientX / window.innerWidth;
    my = 1.0 - e.touches[0].clientY / window.innerHeight;
}, { passive: true });

const VS = `attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const FS = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;

#define PI 3.14159265
#define MAX_STEPS 100
#define MAX_DIST 25.0
#define SURF_DIST 0.003

// ---- NOISE ----
float hash(float n){return fract(sin(n)*43758.5453);}
float noise3(vec3 p){
    vec3 i=floor(p),f=fract(p);
    f=f*f*(3.0-2.0*f);
    float n=i.x+i.y*157.0+i.z*113.0;
    return mix(mix(mix(hash(n),hash(n+1.0),f.x),mix(hash(n+157.0),hash(n+158.0),f.x),f.y),
               mix(mix(hash(n+113.0),hash(n+114.0),f.x),mix(hash(n+270.0),hash(n+271.0),f.x),f.y),f.z);
}
float fbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<4;i++){v+=a*noise3(p);p=p*2.1+1.7;a*=0.5;}return v;}

// ---- SDF HELPERS ----
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}

// SDF of revolution: takes a 2D cross-section and revolves it around Y axis
// profile returns signed distance in 2D (r, y) space
float sdRevolution(vec3 p, float profileDist) {
    return profileDist;
}

// ---- JELLYFISH BELL PROFILE ----
// Real jellyfish bell: dome shape, thinner at edges, open at bottom
// Cross-section in (r, y) space where r = distance from Y axis
float bellProfile(vec2 q, float t) {
    // q.x = radial distance, q.y = height
    // Breathing
    float breathe = sin(t * 1.3) * 0.12;
    float bScale = 1.0 + breathe * 0.15;

    // Outer bell surface: parabolic dome
    // y = bellHeight * (1 - (r/bellRadius)^2)
    float bellR = 1.2 * bScale;
    float bellH = 0.9;
    float rNorm = q.x / bellR;

    // Distance to the dome surface (parabolic revolution)
    // The dome: y = bellH * (1 - rNorm^2) for rNorm in [0,1]
    // We need signed distance to this thin shell

    float domeY = bellH * (1.0 - rNorm * rNorm);
    // Thickness of the membrane — thicker at top, thinner at rim
    float thickness = mix(0.05, 0.015, rNorm * rNorm);

    // Simple signed distance: distance to the dome surface minus thickness
    if (rNorm <= 1.0) {
        float yDist = q.y - domeY;
        // Above dome: outside
        // Below dome but close: inside the shell
        float d = abs(yDist) - thickness;
        // Combine with radial cutoff
        return d;
    } else {
        // Outside bell radius
        vec2 rimPoint = vec2(bellR, 0.0);
        return length(q - rimPoint) - thickness;
    }
}

// ---- FULL BELL SDF ----
float bellSDF(vec3 p, float t) {
    float breathe = sin(t * 1.3) * 0.12;

    // Cylindrical coords
    float r = length(p.xz);
    float y = p.y;

    // Wavy rim
    float angle = atan(p.z, p.x);
    float rimWave = sin(angle * 8.0 + t * 2.0) * 0.04 + sin(angle * 13.0 - t * 3.0) * 0.02;
    // Only at rim region
    float bScale = 1.0 + breathe * 0.15;
    float bellR = 1.2 * bScale;
    float rimMask = smoothstep(bellR * 0.6, bellR, r);
    y += rimWave * rimMask;

    float d = bellProfile(vec2(r, y), t);

    // Surface organic perturbation
    d += fbm(p * 5.0 + t * 0.2) * 0.008;

    return d;
}

// ---- TENTACLE as thin wiggly line SDF ----
float tentacleSDF(vec3 p, float t, float idx, float count) {
    float angle = idx / count * PI * 2.0;
    float breathe = sin(t * 1.3) * 0.12;
    float bScale = 1.0 + breathe * 0.15;
    float baseR = 0.85 * bScale;

    // Rotate p so tentacle is along -Y from its base point
    vec3 base = vec3(cos(angle) * baseR, 0.0, sin(angle) * baseR);

    // Compute distance along tentacle axis (downward from base)
    float ty = -(p.y - base.y); // distance down from base
    if (ty < 0.0 || ty > 3.5) return MAX_DIST;

    float frac = ty / 3.5;

    // Tentacle center wiggles
    float cx = base.x + sin(frac * 7.0 - t * 2.5 + idx * 1.3) * 0.2 * frac
             + sin(t * 0.4 + idx * 2.0) * 0.12 * frac;
    float cz = base.z + cos(frac * 6.0 - t * 2.0 + idx * 1.7) * 0.15 * frac
             + cos(t * 0.3 + idx * 1.5) * 0.1 * frac;

    // Distance from tentacle center line
    float dx = p.x - cx;
    float dz = p.z - cz;
    float dist2D = sqrt(dx * dx + dz * dz);

    // Taper: thick at top, thin at bottom
    float radius = mix(0.02, 0.004, frac);

    return dist2D - radius;
}

// ---- ORAL ARMS — ruffled, thicker central tentacles ----
float oralArmSDF(vec3 p, float t, float idx) {
    float angle = idx / 4.0 * PI * 2.0 + PI * 0.25;
    float baseR = 0.15;
    vec3 base = vec3(cos(angle) * baseR, -0.1, sin(angle) * baseR);

    float ty = -(p.y - base.y);
    if (ty < 0.0 || ty > 2.5) return MAX_DIST;
    float frac = ty / 2.5;

    float cx = base.x + sin(frac * 5.0 - t * 1.8 + idx * 2.0) * 0.15 * frac;
    float cz = base.z + cos(frac * 4.0 - t * 1.5 + idx * 1.7) * 0.12 * frac;

    float dx = p.x - cx;
    float dz = p.z - cz;
    float dist2D = sqrt(dx * dx + dz * dz);

    // Ruffled edges — radius oscillates
    float ruffle = sin(frac * 25.0 + t * 3.0 + idx) * 0.01;
    float radius = mix(0.04, 0.015, frac) + ruffle;

    return dist2D - radius;
}

// ---- SCENE ----
vec3 jellyCenter;

vec2 map(vec3 p, float t) {
    vec3 jp = p - jellyCenter;

    float d = bellSDF(jp, t);
    float id = 1.0;

    // Tentacles
    float tent = MAX_DIST;
    for (float i = 0.0; i < 12.0; i++) {
        tent = min(tent, tentacleSDF(jp, t, i, 12.0));
    }
    if (tent < d) { id = 2.0; }
    d = smin(d, tent, 0.02);

    // Oral arms
    float arms = MAX_DIST;
    for (float i = 0.0; i < 4.0; i++) {
        arms = min(arms, oralArmSDF(jp, t, i));
    }
    if (arms < d) { id = 3.0; }
    d = smin(d, arms, 0.03);

    return vec2(d, id);
}

// ---- RAY MARCH ----
vec2 rayMarch(vec3 ro, vec3 rd, float t) {
    float d = 0.0;
    for (int i = 0; i < MAX_STEPS; i++) {
        vec3 p = ro + rd * d;
        vec2 h = map(p, t);
        if (abs(h.x) < SURF_DIST) return vec2(d, h.y);
        if (d > MAX_DIST) break;
        d += h.x * 0.6;
    }
    return vec2(-1.0);
}

vec3 getNormal(vec3 p, float t) {
    vec2 e = vec2(0.003, 0.0);
    float d = map(p, t).x;
    return normalize(vec3(
        map(p+e.xyy,t).x - d,
        map(p+e.yxy,t).x - d,
        map(p+e.yyx,t).x - d
    ));
}

// ---- VOLUMETRIC SCATTER ----
float scatter(vec3 ro, vec3 rd, float t) {
    float acc = 0.0;
    for (float i = 0.0; i < 30.0; i++) {
        float d = 1.5 + i * 0.25;
        vec3 p = ro + rd * d - jellyCenter;
        float r = length(p.xz);
        float bellDist = length(p * vec3(0.8, 1.0, 0.8));
        // Glow near bell
        acc += exp(-bellDist * bellDist * 1.2) * 0.015;
        // Tentacle region glow
        if (p.y < 0.0) {
            float tGlow = exp(-r * r * 4.0) * smoothstep(0.0, -3.0, p.y);
            acc += tGlow * 0.005;
        }
    }
    return acc;
}

// ---- BACKGROUND ----
vec3 bg(vec2 uv, float t) {
    vec3 col = vec3(0.01, 0.025, 0.06);
    // Flowing depth currents
    float n = fbm(vec3(uv * 3.0, t * 0.08));
    col += n * 0.04 * vec3(0.1, 0.15, 0.3);
    // Particles
    float s = fract(sin(dot(floor(uv * 150.0), vec2(127.1, 311.7))) * 43758.5453);
    if (s > 0.985) {
        float tw = sin(t * 1.5 + s * 80.0) * 0.5 + 0.5;
        col += tw * 0.25 * vec3(0.4, 0.6, 0.9);
    }
    return col;
}

void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
    float t = uTime;

    // Jellyfish position — follows mouse gently + idle bob
    float smx = uMouse.x;
    float smy = uMouse.y;
    jellyCenter = vec3(
        (smx - 0.5) * 2.0,
        (smy - 0.5) * 1.2 + 0.3 + sin(t * 0.5) * 0.2,
        0.0
    );

    vec3 ro = vec3(0, 0.3, 5.5);
    vec3 rd = normalize(vec3(p, -1.5));

    vec3 col = bg(uv, t);

    vec2 res = rayMarch(ro, rd, t);

    if (res.x > 0.0) {
        vec3 hitP = ro + rd * res.x;
        vec3 n = getNormal(hitP, t);
        float id = res.y;
        vec3 jp = hitP - jellyCenter;

        float fresnel = pow(1.0 - max(dot(-rd, n), 0.0), 3.0);

        // Light from above-right
        vec3 lightDir = normalize(vec3(0.3, 1.0, 0.5));
        float diff = max(dot(n, lightDir), 0.0);
        // SSS — light passing through
        float sss = pow(max(dot(rd, lightDir), 0.0), 3.0);

        if (id < 1.5) {
            // BELL — warm coral pink, translucent
            vec3 warmPink = vec3(0.95, 0.5, 0.4);
            vec3 peach = vec3(1.0, 0.7, 0.5);
            vec3 softLav = vec3(0.7, 0.5, 0.85);

            float phase = smoothstep(0.9, -0.3, jp.y);
            vec3 bodyCol = mix(warmPink, peach, phase);

            // Color shift
            bodyCol = mix(bodyCol, softLav, fresnel * 0.4);

            // Veins — radial patterns visible through membrane
            float angle = atan(jp.z, jp.x);
            float vein = pow(max(sin(angle * 16.0 + jp.y * 6.0), 0.0), 12.0);
            bodyCol += vein * 0.12 * vec3(1.0, 0.7, 0.5);

            // Lighting
            bodyCol *= 0.5 + diff * 0.5;
            bodyCol += sss * 0.35 * vec3(1.0, 0.55, 0.35);
            bodyCol += fresnel * 0.5 * vec3(0.8, 0.6, 0.9);

            // Translucent membrane
            float alpha = 0.3 + fresnel * 0.4 + sss * 0.25;
            col = mix(col, bodyCol, alpha);
        }
        else if (id < 2.5) {
            // TENTACLES
            vec3 tentCol = vec3(0.9, 0.55, 0.45);
            // Traveling light pulses
            float pulse = pow(max(sin(jp.y * 6.0 + t * 3.5), 0.0), 8.0);
            tentCol += pulse * 0.5 * vec3(0.6, 0.85, 1.0);
            tentCol += fresnel * vec3(0.5, 0.4, 0.7) * 0.3;
            tentCol *= 0.5 + diff * 0.5;
            float alpha = 0.2 + fresnel * 0.3 + pulse * 0.35;
            alpha *= smoothstep(-3.5, -0.2, jp.y);
            col = mix(col, tentCol, max(alpha, 0.0));
        }
        else {
            // ORAL ARMS
            vec3 armCol = vec3(0.95, 0.65, 0.5);
            armCol += fresnel * vec3(0.6, 0.4, 0.8) * 0.3;
            armCol *= 0.5 + diff * 0.5;
            float alpha = 0.25 + fresnel * 0.3;
            alpha *= smoothstep(-2.5, -0.1, jp.y);
            col = mix(col, armCol, max(alpha, 0.0));
        }
    }

    // Volumetric glow
    float glow = scatter(ro, rd, t);
    col += glow * vec3(0.9, 0.55, 0.45);

    // Vignette
    float vig = 1.0 - length((uv - 0.5) * 1.5);
    col *= smoothstep(0.0, 0.7, vig);

    // Tone map
    col = col / (1.0 + col);
    col = pow(col, vec3(0.92));

    gl_FragColor = vec4(col, 1.0);
}`;

function compile(src, type) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('SHADER ERROR:', gl.getShaderInfoLog(s));
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(VS, gl.VERTEX_SHADER));
gl.attachShader(prog, compile(FS, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uMouse = gl.getUniformLocation(prog, 'uMouse');

let smx = 0.5, smy = 0.5;

function render(ts) {
    ts *= 0.001;
    smx += (mx - smx) * 0.02;
    smy += (my - smy) * 0.02;
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, ts);
    gl.uniform2f(uMouse, smx, smy);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
