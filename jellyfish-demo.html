<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfish</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: #000; cursor: none; }
        canvas { display: block; }
        .cursor { position: fixed; width: 8px; height: 8px; border-radius: 50%; background: rgba(180,220,255,0.6); box-shadow: 0 0 20px rgba(180,220,255,0.3); pointer-events: none; z-index: 10; transform: translate(-50%,-50%); }
        @media(max-width:768px) { body { cursor: auto; } .cursor { display: none; } }
    </style>
</head>
<body>
    <div class="cursor" id="cur"></div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ============================================================
    // SETUP
    // ============================================================
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020815);
    scene.fog = new THREE.FogExp2(0x020815, 0.04);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 6);

    // Bloom
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.2, 0.5, 0.3
    );
    composer.addPass(bloom);

    // ============================================================
    // JELLYFISH BELL — procedural hemisphere with vertex animation
    // ============================================================
    const bellSegW = 48, bellSegH = 32;
    const bellGeo = new THREE.SphereGeometry(1, bellSegW, bellSegH, 0, Math.PI * 2, 0, Math.PI * 0.55);

    // Store original positions for animation
    const bellPositions = bellGeo.attributes.position.array.slice();

    const bellMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uPulse: { value: 0 },
            uColor1: { value: new THREE.Color(0.15, 0.4, 0.9) },
            uColor2: { value: new THREE.Color(0.6, 0.2, 0.8) },
            uColor3: { value: new THREE.Color(0.1, 0.8, 0.7) },
            uRimColor: { value: new THREE.Color(0.3, 0.6, 1.0) },
            uMouseDist: { value: 1.0 },
        },
        vertexShader: `
            uniform float uTime;
            uniform float uPulse;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec2 vUv;
            varying float vFresnel;

            void main() {
                vUv = uv;
                vec3 pos = position;

                // Breathing pulse — bell contracts and expands
                float phase = uv.y; // 0 at top, ~1 at rim
                float breathe = sin(uTime * 1.5) * 0.12;
                // Rim moves more than top
                float expansion = breathe * phase * phase;
                // Radial expansion
                vec2 radial = normalize(pos.xz + 0.001);
                pos.xz += radial * expansion;
                // Vertical compression when expanding
                pos.y -= expansion * 0.3;

                // Gentle wave ripple along the bell
                float ripple = sin(phase * 12.0 + uTime * 3.0) * 0.015 * phase;
                pos.xz += radial * ripple;

                // Organic wobble
                float wobble = sin(uTime * 0.7 + pos.x * 3.0) * cos(uTime * 0.5 + pos.z * 2.0) * 0.02;
                pos.y += wobble;

                vPosition = pos;
                vNormal = normalMatrix * normal;

                // Fresnel
                vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(pos, 1.0)).xyz);
                vec3 worldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                vFresnel = pow(1.0 - max(dot(viewDir, worldNormal), 0.0), 3.0);

                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uRimColor;
            uniform float uMouseDist;

            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec2 vUv;
            varying float vFresnel;

            void main() {
                float phase = vUv.y;

                // Color gradient from top to rim
                vec3 col = mix(uColor1, uColor2, phase);
                // Time-varying color shift
                col = mix(col, uColor3, sin(uTime * 0.3 + phase * 4.0) * 0.3 + 0.3);

                // Internal veins / patterns
                float vein = sin(vUv.x * 30.0 + phase * 5.0 + uTime * 0.5) * 0.5 + 0.5;
                vein = pow(vein, 8.0);
                col += vein * 0.15 * vec3(0.5, 0.8, 1.0);

                // Radial pattern from center
                float radial = sin(phase * 20.0 + uTime) * 0.5 + 0.5;
                radial = pow(radial, 6.0);
                col += radial * 0.08 * uColor3;

                // Rim glow (fresnel)
                col += uRimColor * vFresnel * 0.8;

                // Edge of bell is more transparent
                float alpha = 0.3 + (1.0 - phase) * 0.3;
                // Fresnel adds to visibility at edges
                alpha += vFresnel * 0.4;
                // Mouse proximity brightens
                float proximity = smoothstep(1.0, 0.0, uMouseDist) * 0.3;
                col += proximity * vec3(0.3, 0.5, 1.0);
                alpha += proximity * 0.2;

                gl_FragColor = vec4(col, alpha);
            }
        `,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
    });

    const bell = new THREE.Mesh(bellGeo, bellMat);
    scene.add(bell);

    // ============================================================
    // INNER BELL — smaller, brighter core
    // ============================================================
    const innerGeo = new THREE.SphereGeometry(0.7, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.45);
    const innerMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uColor: { value: new THREE.Color(0.3, 0.5, 1.0) },
        },
        vertexShader: `
            uniform float uTime;
            varying vec2 vUv;
            varying float vFresnel;
            void main() {
                vUv = uv;
                vec3 pos = position;
                float breathe = sin(uTime * 1.5) * 0.08 * uv.y * uv.y;
                vec2 radial = normalize(pos.xz + 0.001);
                pos.xz += radial * breathe;
                pos.y -= breathe * 0.2;

                vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(pos, 1.0)).xyz);
                vec3 worldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                vFresnel = pow(1.0 - max(dot(viewDir, worldNormal), 0.0), 2.0);

                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform vec3 uColor;
            varying vec2 vUv;
            varying float vFresnel;
            void main() {
                vec3 col = uColor * (0.4 + vFresnel * 0.6);
                // Pulsing organs
                float organ = sin(vUv.x * 8.0 + uTime * 2.0) * sin(vUv.y * 12.0 + uTime * 1.5);
                organ = pow(max(organ, 0.0), 4.0);
                col += organ * 0.3 * vec3(0.8, 0.4, 1.0);

                float alpha = 0.1 + vFresnel * 0.3 + organ * 0.1;
                gl_FragColor = vec4(col, alpha);
            }
        `,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
    });
    const innerBell = new THREE.Mesh(innerGeo, innerMat);
    innerBell.position.y = 0.05;
    scene.add(innerBell);

    // ============================================================
    // ORAL ARMS — thick central tentacles
    // ============================================================
    const armCount = 4;
    const armSegments = 40;
    const arms = [];

    for (let a = 0; a < armCount; a++) {
        const curve = [];
        const angle = (a / armCount) * Math.PI * 2;
        const radius = 0.12;
        for (let i = 0; i <= armSegments; i++) {
            const t = i / armSegments;
            curve.push(new THREE.Vector3(
                Math.cos(angle) * radius * (1 + t * 0.5),
                -t * 2.5,
                Math.sin(angle) * radius * (1 + t * 0.5)
            ));
        }
        const path = new THREE.CatmullRomCurve3(curve);
        const tubeGeo = new THREE.TubeGeometry(path, armSegments, 0.04 , 8, false);

        // Store original positions
        const origPos = tubeGeo.attributes.position.array.slice();

        const tubeMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(0.2, 0.4, 0.9) },
                uIndex: { value: a },
            },
            vertexShader: `
                uniform float uTime;
                uniform float uIndex;
                varying float vT;
                varying float vFresnel;
                void main() {
                    // Use y position as progress indicator
                    vT = clamp(-position.y / 2.5, 0.0, 1.0);

                    vec3 pos = position;
                    // Flowing wave
                    float wave = sin(vT * 8.0 - uTime * 2.0 + uIndex * 1.5) * 0.15 * vT;
                    float wave2 = cos(vT * 5.0 - uTime * 1.5 + uIndex * 2.3) * 0.1 * vT;
                    pos.x += wave;
                    pos.z += wave2;
                    // Gentle spiral
                    float spiral = vT * 0.3;
                    pos.x += cos(uTime * 0.3 + uIndex * 1.57 + vT * 3.0) * spiral;
                    pos.z += sin(uTime * 0.3 + uIndex * 1.57 + vT * 3.0) * spiral;

                    vec3 viewDir = normalize(cameraPosition - (modelMatrix * vec4(pos, 1.0)).xyz);
                    vFresnel = pow(1.0 - max(dot(viewDir, normalize(normal)), 0.0), 2.0);

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uColor;
                varying float vT;
                varying float vFresnel;
                void main() {
                    vec3 col = uColor;
                    // Bioluminescent pulses traveling down
                    float pulse = sin(vT * 15.0 - uTime * 3.0) * 0.5 + 0.5;
                    pulse = pow(pulse, 4.0);
                    col += pulse * 0.5 * vec3(0.5, 0.8, 1.0);
                    col += vFresnel * 0.3 * vec3(0.3, 0.5, 1.0);

                    float alpha = (0.4 - vT * 0.3) + pulse * 0.3 + vFresnel * 0.2;
                    gl_FragColor = vec4(col, max(alpha, 0.0));
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
        });

        const arm = new THREE.Mesh(tubeGeo, tubeMat);
        arm.position.y = -0.5;
        scene.add(arm);
        arms.push(arm);
    }

    // ============================================================
    // TRAILING TENTACLES — thin, long, many
    // ============================================================
    const tentCount = 16;
    const tentSegments = 60;
    const tentacles = [];

    for (let t = 0; t < tentCount; t++) {
        const angle = (t / tentCount) * Math.PI * 2 + Math.random() * 0.3;
        const radius = 0.55 + Math.random() * 0.15;
        const length = 3 + Math.random() * 2;
        const points = [];
        for (let i = 0; i <= tentSegments; i++) {
            const p = i / tentSegments;
            points.push(new THREE.Vector3(
                Math.cos(angle) * radius,
                -p * length,
                Math.sin(angle) * radius
            ));
        }
        const path = new THREE.CatmullRomCurve3(points);
        const geo = new THREE.TubeGeometry(path, tentSegments, 0.008 + Math.random() * 0.008, 4, false);

        const mat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uIndex: { value: t },
                uLength: { value: length },
                uColor: { value: new THREE.Color().setHSL(0.6 + Math.random() * 0.15, 0.7, 0.5) },
            },
            vertexShader: `
                uniform float uTime;
                uniform float uIndex;
                uniform float uLength;
                varying float vT;
                void main() {
                    vT = clamp(-position.y / uLength, 0.0, 1.0);
                    vec3 pos = position;
                    // Flowing motion
                    float speed = 1.5 + sin(uIndex) * 0.5;
                    pos.x += sin(vT * 6.0 - uTime * speed + uIndex * 0.7) * 0.2 * vT;
                    pos.z += cos(vT * 5.0 - uTime * speed * 0.8 + uIndex * 1.1) * 0.15 * vT;
                    // Current drift
                    pos.x += sin(uTime * 0.2 + uIndex) * 0.1 * vT;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform float uIndex;
                uniform vec3 uColor;
                varying float vT;
                void main() {
                    // Traveling light dots
                    float dot = sin(vT * 30.0 - uTime * 4.0 + uIndex * 2.0) * 0.5 + 0.5;
                    dot = pow(dot, 12.0);
                    vec3 col = uColor * 0.5 + dot * vec3(0.6, 0.8, 1.0);
                    float alpha = (0.25 - vT * 0.2) + dot * 0.6;
                    gl_FragColor = vec4(col, max(alpha, 0.0));
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });

        const tent = new THREE.Mesh(geo, mat);
        tent.position.y = -0.5;
        scene.add(tent);
        tentacles.push(tent);
    }

    // ============================================================
    // RIM FRILLS — wavy edge ring
    // ============================================================
    const frillGeo = new THREE.TorusGeometry(0.95, 0.06, 8, 64);
    const frillMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
        },
        vertexShader: `
            uniform float uTime;
            varying float vAngle;
            void main() {
                vec3 pos = position;
                float angle = atan(pos.z, pos.x);
                vAngle = angle;
                // Wavy undulation
                pos.y += sin(angle * 8.0 + uTime * 3.0) * 0.06;
                pos.y += sin(angle * 3.0 - uTime * 1.5) * 0.03;
                // Breathing
                float breathe = sin(uTime * 1.5) * 0.05;
                float r = length(pos.xz);
                pos.xz *= 1.0 + breathe * 0.15;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            varying float vAngle;
            void main() {
                float glow = sin(vAngle * 6.0 + uTime * 2.0) * 0.5 + 0.5;
                vec3 col = mix(vec3(0.2, 0.4, 0.9), vec3(0.5, 0.2, 0.8), glow);
                col += pow(glow, 4.0) * 0.3 * vec3(0.8, 0.9, 1.0);
                gl_FragColor = vec4(col, 0.3 + glow * 0.2);
            }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
    });
    const frill = new THREE.Mesh(frillGeo, frillMat);
    frill.position.y = -0.52;
    scene.add(frill);

    // ============================================================
    // PARTICLES — ambient marine snow
    // ============================================================
    const pCount = 500;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    const pSizes = new Float32Array(pCount);
    for (let i = 0; i < pCount; i++) {
        pPos[i*3] = (Math.random()-0.5)*20;
        pPos[i*3+1] = (Math.random()-0.5)*20;
        pPos[i*3+2] = (Math.random()-0.5)*20;
        pSizes[i] = Math.random()*2+0.5;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('size', new THREE.BufferAttribute(pSizes, 1));
    const pMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: `
            attribute float size;
            uniform float uTime;
            varying float vA;
            void main() {
                vec3 pos = position;
                pos.y = mod(pos.y - uTime*0.1 + 10.0, 20.0) - 10.0;
                pos.x += sin(uTime*0.2+pos.y*0.5)*0.3;
                vec4 mv = modelViewMatrix * vec4(pos,1.0);
                gl_PointSize = size * (150.0 / -mv.z);
                gl_Position = projectionMatrix * mv;
                vA = smoothstep(20.0, 3.0, -mv.z);
            }
        `,
        fragmentShader: `
            varying float vA;
            void main() {
                float d = length(gl_PointCoord - 0.5)*2.0;
                float a = smoothstep(1.0,0.0,d)*vA*0.3;
                gl_FragColor = vec4(0.4,0.6,0.9, a);
            }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    scene.add(new THREE.Points(pGeo, pMat));

    // ============================================================
    // JELLYFISH GROUP — for unified movement
    // ============================================================
    const jellyGroup = new THREE.Group();
    jellyGroup.add(bell, innerBell, frill);
    arms.forEach(a => jellyGroup.add(a));
    tentacles.forEach(t => jellyGroup.add(t));
    scene.add(jellyGroup);

    // Remove from scene (they're in the group now)
    scene.remove(bell); scene.remove(innerBell); scene.remove(frill);
    arms.forEach(a => scene.remove(a));
    tentacles.forEach(t => scene.remove(t));

    // ============================================================
    // INTERACTION
    // ============================================================
    let mx = 0, my = 0; // normalized -1 to 1
    let targetX = 0, targetY = 0;
    let jellyX = 0, jellyY = 0;

    document.addEventListener('mousemove', e => {
        mx = (e.clientX / window.innerWidth) * 2 - 1;
        my = -(e.clientY / window.innerHeight) * 2 + 1;
        document.getElementById('cur').style.left = e.clientX + 'px';
        document.getElementById('cur').style.top = e.clientY + 'px';
    });

    document.addEventListener('touchmove', e => {
        mx = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        my = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
    }, { passive: true });

    // ============================================================
    // ANIMATE
    // ============================================================
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Jellyfish follows mouse with smooth lag
        targetX = mx * 2.5;
        targetY = my * 1.5 + 0.3;
        jellyX += (targetX - jellyX) * 0.02;
        jellyY += (targetY - jellyY) * 0.02;

        jellyGroup.position.x = jellyX;
        jellyGroup.position.y = jellyY;

        // Tilt toward movement direction
        const dx = targetX - jellyX;
        const dy = targetY - jellyY;
        jellyGroup.rotation.z = -dx * 0.15;
        jellyGroup.rotation.x = dy * 0.08;

        // Gentle idle bob
        jellyGroup.position.y += Math.sin(t * 0.5) * 0.15;

        // Mouse distance for reactivity
        const mouseDist = Math.sqrt(dx * dx + dy * dy);

        // Update all uniforms
        const allMats = [bellMat, innerMat, frillMat, pMat];
        arms.forEach(a => allMats.push(a.material));
        tentacles.forEach(t => allMats.push(t.material));

        allMats.forEach(m => {
            if (m.uniforms.uTime) m.uniforms.uTime.value = t;
        });
        bellMat.uniforms.uMouseDist.value = mouseDist;

        // Camera subtle movement
        camera.position.x = Math.sin(t * 0.1) * 0.3;
        camera.position.y = Math.cos(t * 0.08) * 0.2;
        camera.lookAt(jellyX * 0.3, jellyY * 0.3, 0);

        composer.render();
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
    </script>
</body>
</html>
