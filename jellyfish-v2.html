<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfish</title>
    <style>
        *{margin:0;padding:0;}
        html,body{height:100%;overflow:hidden;background:#000;}
        canvas{display:block;width:100%;height:100%;}
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false });

function resize() {
    const dpr = Math.min(window.devicePixelRatio, 1.5);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

let mx = 0.5, my = 0.5;
document.addEventListener('mousemove', e => {
    mx = e.clientX / window.innerWidth;
    my = 1.0 - e.clientY / window.innerHeight;
});
document.addEventListener('touchmove', e => {
    mx = e.touches[0].clientX / window.innerWidth;
    my = 1.0 - e.touches[0].clientY / window.innerHeight;
}, { passive: true });

const VS = `attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const FS = `
precision highp float;

uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;

#define PI 3.14159265
#define MAX_STEPS 80
#define MAX_DIST 20.0
#define SURF_DIST 0.005

// ---- NOISE ----
float hash(float n) { return fract(sin(n)*43758.5453); }
float hash2(vec2 p) { return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

float noise(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f*f*(3.0-2.0*f);
    float n = i.x + i.y*157.0 + i.z*113.0;
    return mix(mix(mix(hash(n+0.0), hash(n+1.0), f.x),
                   mix(hash(n+157.0), hash(n+158.0), f.x), f.y),
               mix(mix(hash(n+113.0), hash(n+114.0), f.x),
                   mix(hash(n+270.0), hash(n+271.0), f.x), f.y), f.z);
}

float fbm(vec3 p) {
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 4; i++) {
        v += a * noise(p);
        p = p * 2.1 + vec3(1.7, 9.2, 3.1);
        a *= 0.5;
    }
    return v;
}

// ---- SDF PRIMITIVES ----
float sdSphere(vec3 p, float r) { return length(p) - r; }
float sdEllipsoid(vec3 p, vec3 r) { float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.0)/k1; }
float smin(float a, float b, float k) { float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*0.25; }

// ---- JELLYFISH SDF ----
float jellyfishBell(vec3 p, float t) {
    // Breathing animation
    float breathe = sin(t * 1.2) * 0.15;

    // Bell — oblate ellipsoid, open at bottom
    vec3 bp = p;
    bp.y -= 0.3;
    // Expand/contract with breathing
    float radScale = 1.0 + breathe * 0.15;
    float d = sdEllipsoid(bp, vec3(1.1 * radScale, 0.85, 1.1 * radScale));

    // Carve out the interior (hollow bell)
    float inner = sdEllipsoid(bp + vec3(0, 0.08, 0), vec3(0.95 * radScale, 0.75, 0.95 * radScale));
    d = max(d, -inner);

    // Wavy rim — undulation at the edge
    float angle = atan(p.z, p.x);
    float rimWave = sin(angle * 6.0 + t * 2.5) * 0.06 + sin(angle * 11.0 - t * 1.8) * 0.03;
    // Only affect the lower rim region
    float rimMask = smoothstep(0.0, -0.4, bp.y);
    d -= rimWave * rimMask;

    // Organic surface noise — subtle bumps
    float surfNoise = fbm(p * 4.0 + t * 0.3) * 0.03;
    d += surfNoise;

    return d;
}

float tentacle(vec3 p, float t, float idx) {
    // Parametric tentacle as series of spheres
    float d = MAX_DIST;
    float angle = idx * PI * 2.0 / 8.0;
    float baseR = 0.7 + sin(idx * 2.3) * 0.1;

    for (float i = 0.0; i < 12.0; i++) {
        float frac = i / 12.0;
        vec3 center;
        center.x = cos(angle) * baseR + sin(frac * 6.0 - t * 2.0 + idx) * 0.3 * frac;
        center.y = -0.5 - frac * 3.0;
        center.z = sin(angle) * baseR + cos(frac * 5.0 - t * 1.5 + idx * 1.3) * 0.25 * frac;
        // Current drift
        center.x += sin(t * 0.3 + idx) * 0.15 * frac;
        float r = mix(0.04, 0.008, frac);
        d = smin(d, sdSphere(p - center, r), 0.06);
    }
    return d;
}

float oralArm(vec3 p, float t, float idx) {
    float d = MAX_DIST;
    float angle = idx * PI * 2.0 / 4.0 + PI * 0.25;
    for (float i = 0.0; i < 10.0; i++) {
        float frac = i / 10.0;
        vec3 center;
        center.x = cos(angle) * 0.15 + sin(frac * 4.0 - t * 1.5 + idx * 2.0) * 0.2 * frac;
        center.y = -0.5 - frac * 2.2;
        center.z = sin(angle) * 0.15 + cos(frac * 3.0 - t * 1.2 + idx * 1.7) * 0.15 * frac;
        // Ruffled width
        float r = (0.06 + sin(frac * 15.0 + t) * 0.02) * (1.0 - frac * 0.5);
        d = smin(d, sdSphere(p - center, r), 0.08);
    }
    return d;
}

// Combined scene
vec2 map(vec3 p, float t) {
    // Jellyfish center follows mouse slightly
    vec3 offset = vec3((uMouse.x - 0.5) * 1.5, (uMouse.y - 0.5) * 0.8 + 0.2, 0.0);
    vec3 jp = p - offset;

    // Gentle idle bob
    jp.y -= sin(t * 0.5) * 0.15;

    float bell = jellyfishBell(jp, t);
    float id = 1.0; // bell

    // Tentacles
    float tents = MAX_DIST;
    for (float i = 0.0; i < 8.0; i++) {
        tents = min(tents, tentacle(jp, t, i));
    }
    if (tents < bell) { bell = smin(bell, tents, 0.05); id = 2.0; }

    // Oral arms
    float arms = MAX_DIST;
    for (float i = 0.0; i < 4.0; i++) {
        arms = min(arms, oralArm(jp, t, i));
    }
    if (arms < bell) { bell = smin(bell, arms, 0.08); id = 3.0; }

    return vec2(bell, id);
}

// ---- RAY MARCH ----
vec2 rayMarch(vec3 ro, vec3 rd, float t) {
    float d = 0.0;
    vec2 res = vec2(-1.0);
    for (int i = 0; i < MAX_STEPS; i++) {
        vec3 p = ro + rd * d;
        vec2 h = map(p, t);
        if (abs(h.x) < SURF_DIST) { res = vec2(d, h.y); break; }
        if (d > MAX_DIST) break;
        d += h.x * 0.7; // slow step for better quality
    }
    return res;
}

vec3 getNormal(vec3 p, float t) {
    vec2 e = vec2(0.005, 0.0);
    float d = map(p, t).x;
    return normalize(vec3(
        map(p + e.xyy, t).x - d,
        map(p + e.yxy, t).x - d,
        map(p + e.yyx, t).x - d
    ));
}

// ---- VOLUMETRIC GLOW (cheap) ----
float volumetricGlow(vec3 ro, vec3 rd, float t) {
    float glow = 0.0;
    vec3 offset = vec3((uMouse.x - 0.5) * 1.5, (uMouse.y - 0.5) * 0.8 + 0.2, 0.0);
    offset.y += sin(t * 0.5) * 0.15;
    for (float i = 0.0; i < 20.0; i++) {
        float d = 2.0 + i * 0.3;
        vec3 p = ro + rd * d;
        vec3 jp = p - offset;
        float dist = length(jp * vec3(1.0, 1.2, 1.0));
        // Bell proximity glow
        glow += exp(-dist * dist * 1.5) * 0.02;
        // Tentacle region
        if (jp.y < -0.3) {
            float tentDist = length(jp.xz) * 2.0;
            float vertFade = smoothstep(-0.3, -3.0, jp.y);
            glow += exp(-tentDist * tentDist * 3.0) * vertFade * 0.008;
        }
    }
    return glow;
}

// ---- BACKGROUND ----
vec3 background(vec2 uv, float t) {
    // Deep ocean with subtle swirling nebula
    vec3 col = vec3(0.01, 0.02, 0.06);
    // Flowing currents
    float n = fbm(vec3(uv * 3.0, t * 0.1));
    float n2 = fbm(vec3(uv * 5.0 + 3.0, t * 0.08 + 5.0));
    col += n * n2 * 0.06 * vec3(0.1, 0.2, 0.4);
    // Stars / marine snow
    float star = hash2(floor(uv * 200.0));
    if (star > 0.98) {
        float twinkle = sin(t * 2.0 + star * 100.0) * 0.5 + 0.5;
        col += twinkle * 0.3 * vec3(0.5, 0.7, 1.0);
    }
    // Nebula swirl
    float swirl = fbm(vec3(uv * 2.0 + vec2(sin(t*0.05), cos(t*0.07)), t * 0.05));
    col += swirl * 0.04 * vec3(0.15, 0.25, 0.5);
    return col;
}

void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
    float t = uTime;

    // Camera
    vec3 ro = vec3(0, 0, 5.5);
    vec3 rd = normalize(vec3(p, -1.5));

    // Background
    vec3 col = background(uv, t);

    // Ray march
    vec2 res = rayMarch(ro, rd, t);

    if (res.x > 0.0) {
        vec3 hitP = ro + rd * res.x;
        vec3 n = getNormal(hitP, t);
        float id = res.y;

        // Offset for jellyfish-local coords
        vec3 offset = vec3((uMouse.x-0.5)*1.5, (uMouse.y-0.5)*0.8+0.2, 0.0);
        offset.y += sin(t*0.5)*0.15;
        vec3 jp = hitP - offset;

        // Fresnel
        float fresnel = pow(1.0 - max(dot(-rd, n), 0.0), 3.0);

        // ---- BELL COLORING ----
        if (id < 1.5) {
            // Warm coral-pink base, matching reference
            vec3 warmPink = vec3(0.9, 0.45, 0.35);
            vec3 peach = vec3(1.0, 0.65, 0.45);
            vec3 cyan = vec3(0.3, 0.8, 0.75);

            float phase = smoothstep(0.8, -0.5, jp.y);
            vec3 bodyCol = mix(warmPink, peach, phase);
            // Color shift over time
            bodyCol = mix(bodyCol, cyan, sin(t * 0.2 + jp.y * 2.0) * 0.15 + 0.1);

            // Internal veins
            float angle = atan(jp.z, jp.x);
            float vein = pow(sin(angle * 12.0 + jp.y * 8.0 + t * 0.5) * 0.5 + 0.5, 6.0);
            bodyCol += vein * 0.15 * vec3(1.0, 0.8, 0.6);

            // Subsurface scattering approximation
            vec3 lightDir = normalize(vec3(0.3, 1.0, 0.5));
            float sss = pow(max(dot(rd, lightDir), 0.0), 2.0) * 0.4;
            bodyCol += sss * vec3(1.0, 0.5, 0.3);

            // Rim glow
            bodyCol += fresnel * 0.6 * vec3(0.8, 0.5, 0.9);

            // Translucency
            float alpha = 0.35 + fresnel * 0.4 + sss * 0.3;
            col = mix(col, bodyCol, alpha);
        }

        // ---- TENTACLE COLORING ----
        if (id > 1.5 && id < 2.5) {
            vec3 tentCol = vec3(0.85, 0.5, 0.4);
            // Traveling bioluminescent pulses
            float pulse = pow(sin(jp.y * 5.0 + t * 3.0) * 0.5 + 0.5, 6.0);
            tentCol += pulse * vec3(0.5, 0.8, 1.0) * 0.4;
            tentCol += fresnel * vec3(0.6, 0.4, 0.8) * 0.3;
            float alpha = 0.25 + fresnel * 0.3 + pulse * 0.3;
            // Fade with depth
            alpha *= smoothstep(-4.0, -0.5, jp.y);
            col = mix(col, tentCol, max(alpha, 0.0));
        }

        // ---- ORAL ARM COLORING ----
        if (id > 2.5) {
            vec3 armCol = vec3(0.95, 0.6, 0.45);
            float ruffle = pow(sin(jp.y * 10.0 + t * 2.0) * 0.5 + 0.5, 3.0);
            armCol += ruffle * vec3(1.0, 0.8, 0.5) * 0.2;
            armCol += fresnel * vec3(0.7, 0.5, 0.9) * 0.3;
            float alpha = 0.3 + fresnel * 0.3;
            alpha *= smoothstep(-3.5, -0.3, jp.y);
            col = mix(col, armCol, max(alpha, 0.0));
        }
    }

    // Volumetric glow around jellyfish
    float glow = volumetricGlow(ro, rd, t);
    col += glow * vec3(0.9, 0.5, 0.4);

    // Vignette
    float vig = 1.0 - length((uv - 0.5) * 1.6);
    col *= smoothstep(0.0, 0.7, vig);

    // Tone mapping
    col = col / (1.0 + col);
    col = pow(col, vec3(0.9));

    gl_FragColor = vec4(col, 1.0);
}`;

function compile(src, type) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(VS, gl.VERTEX_SHADER));
gl.attachShader(prog, compile(FS, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uMouse = gl.getUniformLocation(prog, 'uMouse');

// Smooth mouse
let smx = 0.5, smy = 0.5;

function render(ts) {
    ts *= 0.001;
    smx += (mx - smx) * 0.03;
    smy += (my - smy) * 0.03;
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, ts);
    gl.uniform2f(uMouse, smx, smy);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
